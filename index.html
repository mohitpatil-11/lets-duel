  <script>
    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;  // 450 portrait
    const H = canvas.height; // 700 portrait

    // Game Control Flags
    let isRunning = false;
    let gameMode = 'ai'; // 'ai', 'pvp'
    let aiDifficulty = 'normal'; // 'easy', 'normal', 'pro'
    let lastTime = 0;
    let timeScale = 1.0;
    let soundEnabled = true;
    let selectedWeaponType = 'revolver';

    // Effects
    let screenShakeTime = 0;
    let screenShakeForce = 0;

    // Entity Lists
    let bullets = [];
    let particles = [];
    let combatTexts = [];
    let arenaPickups = [];
    let bouncePads = [];
    let obstacles = [];

    let player1, player2;

    // Weapon Configurations
    const WEAPONS = {
      revolver: {
        name: 'REVOLVER',
        damage: 30,
        recoilForce: 520,
        torqueKick: 8,
        spinBase: 1.5,
        mass: 1.0,
        cooldown: 0.35,
        maxAmmo: 6,
        reloadTime: 1.4,
        bulletSpeed: 850,
        spread: 0,
        pellets: 1,
        color: '#f59e0b',
        spec: 'REVOLVER (BALANCED)'
      },
      shotgun: {
        name: 'SHOTGUN',
        damage: 14,
        recoilForce: 820,
        torqueKick: 12,
        spinBase: 1.7,
        mass: 1.4,
        cooldown: 0.65,
        maxAmmo: 4,
        reloadTime: 1.8,
        bulletSpeed: 750,
        spread: 0.22,
        pellets: 4,
        color: '#ef4444',
        spec: 'SHOTGUN (HEAVY KICK)'
      },
      smg: {
        name: 'SMG',
        damage: 14,
        recoilForce: 300,
        torqueKick: 5,
        spinBase: 2.0,
        mass: 0.8,
        cooldown: 0.15,
        maxAmmo: 12,
        reloadTime: 1.2,
        bulletSpeed: 820,
        spread: 0.08,
        pellets: 1,
        color: '#10b981',
        spec: 'SMG (RAPID BURST)'
      },
      sniper: {
        name: 'SNIPER',
        damage: 60,
        recoilForce: 1000,
        torqueKick: 15,
        spinBase: 1.2,
        mass: 1.7,
        cooldown: 0.85,
        maxAmmo: 3,
        reloadTime: 2.0,
        bulletSpeed: 1300,
        spread: 0,
        pellets: 1,
        color: '#3b82f6',
        spec: 'HEAVY SNIPER (HIGH DAMAGE)'
      },
      plasma: {
        name: 'PLASMA',
        damage: 40,
        recoilForce: 650,
        torqueKick: 9,
        spinBase: 1.6,
        mass: 1.1,
        cooldown: 0.45,
        maxAmmo: 5,
        reloadTime: 1.5,
        bulletSpeed: 650,
        spread: 0,
        pellets: 1,
        color: '#a855f7',
        spec: 'PLASMA (ENERGY BLAST)'
      }
    };

    // Procedural Web Audio Engine
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playShoot(type) {
        if (!soundEnabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type === 'plasma' ? 'sine' : 'sawtooth';
          const freq = type === 'sniper' ? 450 : (type === 'shotgun' ? 200 : 320);
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch(e){}
      },
      playHit() {
        if (!soundEnabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch(e){}
      },
      playBounce() {
        if (!soundEnabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch(e){}
      },
      playPickup() {
        if (!soundEnabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        } catch(e){}
      }
    };

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function selectWeapon(type) {
      selectedWeaponType = type;
      document.querySelectorAll('.weapon-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500/20', 'border-2', 'border-amber-500', 'text-white');
        btn.classList.add('bg-slate-800', 'border', 'border-slate-700', 'text-slate-400');
      });
      const activeBtn = document.getElementById(`btn-${type}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-400');
        activeBtn.classList.add('bg-amber-500/20', 'border-2', 'border-amber-500', 'text-white');
      }
      document.getElementById('weapon-spec').innerText = WEAPONS[type].spec;
    }

    function selectDifficulty(diff) {
      aiDifficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500/20', 'border-2', 'border-amber-500', 'text-amber-300');
        btn.classList.add('bg-slate-800', 'border', 'border-slate-700', 'text-slate-400');
      });
      const activeBtn = document.getElementById(`diff-${diff}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-400');
        activeBtn.classList.add('bg-amber-500/20', 'border-2', 'border-amber-500', 'text-amber-300');
      }
    }

    // Floating Text FX
    class FloatingText {
      constructor(x, y, text, color) {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.life = 0.8; this.maxLife = 0.8;
      }
      update(dt) {
        this.y -= 30 * dt;
        this.life -= dt;
      }
      draw() {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.font = '900 13px Orbitron';
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    // Bullet Class
    class Bullet {
      constructor(x, y, vx, vy, isPlayer1, config) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.isPlayer1 = isPlayer1;
        this.config = config;
        this.radius = config.pellets > 1 ? 3 : 4;
        this.active = true;
        this.trail = [];
      }
      update(dt) {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 5) this.trail.shift();

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        if (this.x < 10 || this.x > W - 10 || this.y < 10 || this.y > H - 10) {
          this.active = false;
          createSparks(this.x, this.y, '#cbd5e1');
        }
      }
      draw() {
        ctx.beginPath();
        for (let i = 0; i < this.trail.length; i++) {
          const pt = this.trail[i];
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.strokeStyle = this.isPlayer1 ? 'rgba(245, 158, 11, 0.4)' : 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = this.radius * 1.5;
        ctx.stroke();

        ctx.fillStyle = this.config.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Spark Particle
    class Particle {
      constructor(x, y, vx, vy, color, life) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.life = life; this.maxLife = life;
      }
      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 150 * dt;
        this.life -= dt;
      }
      draw() {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5 * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    function createSparks(x, y, color) {
      for (let i = 0; i < 6; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 140 + 30;
        particles.push(new Particle(x, y, Math.cos(ang) * spd, Math.sin(ang) * spd, color, 0.15 + Math.random() * 0.1));
      }
    }

    // Pickup Crate Class
    class PickupCrate {
      constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type; // 'health' or 'ammo'
        this.size = 22; this.active = true; this.pulse = 0;
      }
      update(dt) { this.pulse += dt * 4; }
      draw() {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        const fy = Math.sin(this.pulse) * 3;
        ctx.fillStyle = this.type === 'health' ? 'rgba(16, 185, 129, 0.25)' : 'rgba(245, 158, 11, 0.25)';
        ctx.strokeStyle = this.type === 'health' ? '#10b981' : '#f59e0b';
        ctx.lineWidth = 2;
        ctx.fillRect(-this.size/2, -this.size/2 + fy, this.size, this.size);
        ctx.strokeRect(-this.size/2, -this.size/2 + fy, this.size, this.size);
        ctx.fillStyle = this.type === 'health' ? '#10b981' : '#f59e0b';
        ctx.font = '900 11px Orbitron';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type === 'health' ? '+' : '⚡', 0, fy);
        ctx.restore();
      }
    }

    // Bounce Pad
    class BouncePad {
      constructor(x, y, w, h, nx, ny) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.nx = nx; this.ny = ny; this.anim = 0;
      }
      trigger() { this.anim = 0.2; AudioEngine.playBounce(); }
      update(dt) { if (this.anim > 0) this.anim -= dt; }
      draw() {
        ctx.save();
        ctx.fillStyle = this.anim > 0 ? '#38bdf8' : '#0284c7';
        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 1.5;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.strokeRect(this.x, this.y, this.w, this.h);
        ctx.restore();
      }
    }

    // Physics Gun Class
    class PhysicsGun {
      constructor(x, y, config, isPlayer1) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.config = config;
        this.isPlayer1 = isPlayer1;

        this.angle = isPlayer1 ? -Math.PI / 4 : -Math.PI * 3 / 4;
        this.spinSpeed = config.spinBase * (isPlayer1 ? 1 : -1);

        this.hp = 100;
        this.ammo = config.maxAmmo;
        this.cooldown = 0;
        this.reloading = false;
        this.reloadTimer = 0;
        this.alive = true;
        this.radius = 18;
      }

      update(dt) {
        if (!this.alive) return;

        // Auto spin rotation with gentle damping
        this.angle += this.spinSpeed * dt;
        this.spinSpeed *= Math.exp(-0.4 * dt);

        // Physics step
        const gravity = 420;
        this.vy += gravity * dt;
        this.vx *= Math.exp(-0.75 * dt);
        this.vy *= Math.exp(-0.75 * dt);

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Boundary bounce
        const margin = 22;
        const bnc = 0.65;
        if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx) * bnc; this.spinSpeed *= -0.8; }
        if (this.x > W - margin) { this.x = W - margin; this.vx = -Math.abs(this.vx) * bnc; this.spinSpeed *= -0.8; }
        if (this.y < margin) { this.y = margin; this.vy = Math.abs(this.vy) * bnc; }
        if (this.y > H - margin - 10) { this.y = H - margin - 10; this.vy = -Math.abs(this.vy) * bnc; this.vx *= 0.85; }

        // Bounce pads
        bouncePads.forEach(pad => {
          if (this.x > pad.x - 12 && this.x < pad.x + pad.w + 12 && this.y > pad.y - 12 && this.y < pad.y + pad.h + 12) {
            pad.trigger();
            if (pad.nx !== 0) this.vx = pad.nx * 580;
            if (pad.ny !== 0) this.vy = pad.ny * 680;
            this.spinSpeed = (Math.random() - 0.5) * 10;
          }
        });

        // Obstacles
        obstacles.forEach(obs => {
          if (this.x > obs.x - 12 && this.x < obs.x + obs.w + 12 && this.y > obs.y - 12 && this.y < obs.y + obs.h + 12) {
            this.vy = -Math.abs(this.vy) * 0.7;
            this.vx *= -0.7;
          }
        });

        // Pickups
        arenaPickups.forEach(crate => {
          if (crate.active && Math.hypot(this.x - crate.x, this.y - crate.y) < this.radius + 12) {
            crate.active = false;
            AudioEngine.playPickup();
            if (crate.type === 'health') {
              this.hp = Math.min(100, this.hp + 30);
              combatTexts.push(new FloatingText(this.x, this.y - 18, '+30 HP', '#10b981'));
            } else {
              this.ammo = this.config.maxAmmo;
              this.reloading = false;
              combatTexts.push(new FloatingText(this.x, this.y - 18, 'AMMO REFILL', '#f59e0b'));
            }
          }
        });

        if (this.cooldown > 0) this.cooldown -= dt;
        if (this.reloading) {
          this.reloadTimer -= dt;
          if (this.reloadTimer <= 0) {
            this.reloading = false;
            this.ammo = this.config.maxAmmo;
          }
        }
      }

      shoot() {
        if (!this.alive || !isRunning) return;
        if (this.reloading || this.cooldown > 0) return;

        if (this.ammo <= 0) {
          this.reloading = true;
          this.reloadTimer = this.config.reloadTime;
          combatTexts.push(new FloatingText(this.x, this.y - 20, 'RELOADING', '#cbd5e1'));
          return;
        }

        this.ammo--;
        this.cooldown = this.config.cooldown;
        AudioEngine.playShoot(this.config.name.toLowerCase());

        const dirX = Math.cos(this.angle);
        const dirY = Math.sin(this.angle);

        // Recoil vector & torque kick
        const recoil = this.config.recoilForce / this.config.mass;
        this.vx -= dirX * recoil;
        this.vy -= dirY * recoil;
        this.spinSpeed = (dirY > 0 ? 1 : -1) * this.config.torqueKick + (Math.random() * 3);

        const barrelLen = 26;
        const muzzleX = this.x + dirX * barrelLen;
        const muzzleY = this.y + dirY * barrelLen;

        for (let i = 0; i < this.config.pellets; i++) {
          const spreadAngle = this.angle + (Math.random() - 0.5) * this.config.spread;
          const bVx = Math.cos(spreadAngle) * this.config.bulletSpeed;
          const bVy = Math.sin(spreadAngle) * this.config.bulletSpeed;
          bullets.push(new Bullet(muzzleX, muzzleY, bVx, bVy, this.isPlayer1, this.config));
        }

        for (let k = 0; k < 5; k++) {
          const pAng = this.angle + (Math.random() - 0.5) * 0.4;
          const pSpd = Math.random() * 180 + 60;
          particles.push(new Particle(muzzleX, muzzleY, Math.cos(pAng) * pSpd, Math.sin(pAng) * pSpd, '#fef08a', 0.12));
        }

        screenShakeTime = 0.08;
        screenShakeForce = this.config.recoilForce * 0.004;

        if (this.ammo <= 0) {
          this.reloading = true;
          this.reloadTimer = this.config.reloadTime;
        }
      }

      draw() {
        if (!this.alive) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // Aim dotted line
        const guideLen = 140;
        ctx.strokeStyle = this.isPlayer1 ? 'rgba(245, 158, 11, 0.35)' : 'rgba(239, 68, 68, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(this.angle) * guideLen, Math.sin(this.angle) * guideLen);
        ctx.stroke();
        ctx.setLineDash([]);

        // Render Gun
        ctx.rotate(this.angle);
        const themeColor = this.isPlayer1 ? '#f59e0b' : '#ef4444';

        ctx.fillStyle = themeColor;
        ctx.fillRect(-8, -5, 26, 10);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(6, -3, 18, 6);
        ctx.fillStyle = '#334155';
        ctx.fillRect(-5, 3, 10, 13);

        ctx.restore();

        // Reload progress arc
        if (this.reloading) {
          ctx.save();
          ctx.beginPath();
          const progress = 1 - (this.reloadTimer / this.config.reloadTime);
          ctx.arc(this.x, this.y - 26, 8, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * progress));
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    // AI Timing Logic
    function updateAI(dt) {
      if (!player2 || !player2.alive || !player1 || !player1.alive) return;

      const dx = player1.x - player2.x;
      const dy = player1.y - player2.y;
      const targetAngle = Math.atan2(dy, dx);

      let angleDiff = Math.abs(player2.angle - targetAngle);
      while (angleDiff > Math.PI * 2) angleDiff -= Math.PI * 2;
      if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

      const threshold = aiDifficulty === 'pro' ? 0.45 : (aiDifficulty === 'normal' ? 0.35 : 0.25);
      const hitChance = aiDifficulty === 'pro' ? 0.9 : (aiDifficulty === 'normal' ? 0.7 : 0.45);

      if (angleDiff < threshold && player2.cooldown <= 0 && !player2.reloading) {
        if (Math.random() < hitChance) {
          player2.shoot();
        }
      }
    }

    // Environment Setup
    function setupEnvironment() {
      bouncePads = [
        new BouncePad(0, H / 2 - 40, 14, 80, 1, 0),
        new BouncePad(W - 14, H / 2 - 40, 14, 80, -1, 0),
        new BouncePad(W / 2 - 50, H - 14, 100, 14, 0, -1)
      ];

      obstacles = [
        { x: W / 2 - 45, y: H / 3, w: 90, h: 18 }
      ];
    }

    // Start Game
    function startGame(mode) {
      AudioEngine.init();
      gameMode = mode;

      document.getElementById('menu-overlay').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('gameover-overlay').classList.add('opacity-0', 'pointer-events-none');

      setupEnvironment();

      const p1Config = WEAPONS[selectedWeaponType];
      const p2Config = mode === 'pvp' ? WEAPONS[selectedWeaponType] : WEAPONS['revolver'];

      player1 = new PhysicsGun(100, 200, p1Config, true);
      player2 = new PhysicsGun(W - 100, 200, p2Config, false);

      bullets = [];
      particles = [];
      combatTexts = [];
      arenaPickups = [];

      document.getElementById('p1-gun-name').innerText = p1Config.name.substring(0, 4);
      document.getElementById('p2-gun-name').innerText = mode === 'pvp' ? p2Config.name.substring(0, 4) : 'BOT';

      const p2Btn = document.getElementById('p2-touch-btn');
      if (mode === 'pvp') {
        p2Btn.classList.remove('opacity-40', 'pointer-events-none');
      } else {
        p2Btn.classList.add('opacity-40', 'pointer-events-none');
      }

      isRunning = true;
      timeScale = 1.0;
      lastTime = performance.now();

      updateHUD();
      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      startGame(gameMode);
    }

    function triggerVictory(winnerName) {
      timeScale = 0.25;
      setTimeout(() => {
        isRunning = false;
        document.getElementById('winner-text').innerText = winnerName.toUpperCase() + " WINS!";
        document.getElementById('gameover-overlay').classList.remove('opacity-0', 'pointer-events-none');
      }, 1000);
    }

    function updateHUD() {
      if (!player1 || !player2) return;

      const p1Hp = Math.max(0, Math.ceil(player1.hp));
      const p2Hp = Math.max(0, Math.ceil(player2.hp));

      document.getElementById('p1-hp-fill').style.width = p1Hp + '%';
      document.getElementById('p2-hp-fill').style.width = p2Hp + '%';

      document.getElementById('p1-ammo-text').innerText = player1.reloading ? 'RELOAD' : `${player1.ammo}/${player1.config.maxAmmo}`;
      document.getElementById('p2-ammo-text').innerText = player2.reloading ? 'RELOAD' : `${player2.ammo}/${player2.config.maxAmmo}`;
    }

    // Touch Controls
    document.getElementById('p1-touch-btn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      AudioEngine.init();
      if (player1) player1.shoot();
    });

    document.getElementById('p2-touch-btn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      AudioEngine.init();
      if (gameMode === 'pvp' && player2) player2.shoot();
    });

    // Keyboard Fallback
    window.addEventListener('keydown', (e) => {
      AudioEngine.init();
      if (e.code === 'KeyW' || e.code === 'Space') {
        e.preventDefault();
        if (player1) player1.shoot();
      }
      if (e.code === 'ArrowUp') {
        e.preventDefault();
        if (gameMode === 'pvp' && player2) player2.shoot();
      }
    });

    // Direct Canvas Tap
    canvas.addEventListener('pointerdown', (e) => {
      AudioEngine.init();
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (gameMode === 'pvp' && clickX > rect.width / 2) {
        if (player2) player2.shoot();
      } else {
        if (player1) player1.shoot();
      }
    });

    // Crate Timer
    setInterval(() => {
      if (isRunning && arenaPickups.length < 2) {
        const type = Math.random() > 0.4 ? 'ammo' : 'health';
        const rx = Math.random() * (W - 160) + 80;
        const ry = Math.random() * (H - 200) + 80;
        arenaPickups.push(new PickupCrate(rx, ry, type));
      }
    }, 7000);

    // Main Game Loop
    function gameLoop(timestamp) {
      if (!isRunning) return;

      let dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (dt > 0.05) dt = 0.05;
      dt *= timeScale;

      // Updates
      player1.update(dt);
      player2.update(dt);

      if (gameMode === 'ai') {
        updateAI(dt);
      }

      bouncePads.forEach(pad => pad.update(dt));
      arenaPickups.forEach(crate => crate.update(dt));

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update(dt);
        if (!b.active) bullets.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(dt);
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = combatTexts.length - 1; i >= 0; i--) {
        const t = combatTexts[i];
        t.update(dt);
        if (t.life <= 0) combatTexts.splice(i, 1);
      }

      // Hit Collisions
      bullets.forEach(b => {
        if (!b.active) return;
        const target = b.isPlayer1 ? player2 : player1;

        if (target.alive) {
          const dist = Math.hypot(b.x - target.x, b.y - target.y);
          if (dist < target.radius + b.radius) {
            b.active = false;
            target.hp -= b.config.damage;

            AudioEngine.playHit();
            createSparks(b.x, b.y, b.config.color);

            target.vx += b.vx * 0.2;
            target.vy += b.vy * 0.2;
            target.spinSpeed += (Math.random() - 0.5) * 16;

            combatTexts.push(new FloatingText(target.x, target.y - 12, `-${b.config.damage}`, '#ef4444'));
            updateHUD();

            if (target.hp <= 0 && target.alive) {
              target.alive = false;
              triggerVictory(b.isPlayer1 ? "Player 1" : (gameMode === 'pvp' ? "Player 2" : "AI Bot"));
            }
          }
        }
      });

      updateHUD();

      // Render
      ctx.clearRect(0, 0, W, H);

      ctx.save();
      if (screenShakeTime > 0) {
        screenShakeTime -= dt;
        ctx.translate((Math.random() - 0.5) * screenShakeForce * 8, (Math.random() - 0.5) * screenShakeForce * 8);
      }

      // Grid background
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.2)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Obstacles
      ctx.fillStyle = '#334155';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
      });

      // Render items
      bouncePads.forEach(pad => pad.draw());
      arenaPickups.forEach(crate => crate.draw());
      particles.forEach(p => p.draw());
      bullets.forEach(b => b.draw());
      player1.draw();
      player2.draw();
      combatTexts.forEach(t => t.draw());

      ctx.restore();

      if (isRunning) {
        requestAnimationFrame(gameLoop);
      }
    }
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Let’s Duel</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Let’s Duel">
  <meta property="og:description" content="Physics shooter duel. Play vs a bot, locally, or online with friends!">
  <meta property="og:image" content="https://mohitpatil-11.github.io/lets-duel/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Let’s Duel">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700;900&display=swap');
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; background-color:#020617; }
    body { font-family:'Inter',sans-serif; }
    .font-orbitron { font-family:'Orbitron',sans-serif; }
    .glow-title { text-shadow:0 0 20px rgba(245,158,11,.6),0 0 35px rgba(239,68,68,.4); }
    .pulse-btn { animation:pulseGlow 1.8s infinite alternate; }
    @keyframes pulseGlow { 0%{box-shadow:0 0 12px rgba(245,158,11,.4);} 100%{box-shadow:0 0 25px rgba(245,158,11,.8);} }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-between p-2 select-none h-full w-full">

  <!-- Top HUD -->
  <div class="w-full max-w-md flex items-center justify-between px-3 py-2 bg-slate-900/90 border border-slate-800 rounded-2xl shadow-lg z-10 text-xs shrink-0 mt-1">
    <div class="flex items-center gap-2 w-[44%]">
      <div class="font-orbitron font-black text-amber-400 text-sm">P1</div>
      <div class="flex-1 flex flex-col gap-1">
        <div class="h-3.5 bg-slate-800 rounded-full border border-slate-700 overflow-hidden relative shadow-inner">
          <div id="p1-hp-fill" class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 transition-all duration-150 w-full rounded-full"></div>
        </div>
        <div class="flex justify-between items-center text-[10px] font-orbitron text-slate-300">
          <span id="p1-gun-name" class="font-bold truncate max-w-[60px]">REV</span>
          <span id="p1-ammo-text" class="text-amber-400 font-black">6/6</span>
        </div>
      </div>
    </div>
    <button id="sound-toggle" onclick="toggleSound()" class="px-2 py-1 text-xs font-orbitron text-slate-300 hover:text-white active:scale-95 transition-transform bg-slate-800 border border-slate-700 rounded-xl">🔊</button>
    <div class="flex items-center justify-end gap-2 w-[44%]">
      <div class="flex-1 flex flex-col gap-1 text-right">
        <div class="h-3.5 bg-slate-800 rounded-full border border-slate-700 overflow-hidden relative shadow-inner">
          <div id="p2-hp-fill" class="h-full bg-gradient-to-l from-rose-500 to-red-400 transition-all duration-150 w-full rounded-full"></div>
        </div>
        <div class="flex justify-between items-center text-[10px] font-orbitron text-slate-300">
          <span id="p2-ammo-text" class="text-rose-400 font-black">6/6</span>
          <span id="p2-gun-name" class="font-bold truncate max-w-[60px]">BOT</span>
        </div>
      </div>
      <div class="font-orbitron font-black text-rose-400 text-sm">P2</div>
    </div>
  </div>

  <div id="p3-hud" style="display:none" class="w-full max-w-md items-center gap-3 px-3 py-1 mt-1 bg-slate-900/90 border border-slate-800 rounded-2xl text-[10px] font-orbitron shrink-0">
    <div class="flex items-center gap-1 flex-1"><span class="font-black text-green-400">P3</span><div class="flex-1 h-2.5 bg-slate-800 rounded-full overflow-hidden"><div id="p3-hp-fill" class="h-full bg-gradient-to-r from-green-500 to-emerald-300 transition-all duration-150 w-full rounded-full"></div></div><span id="p3-ammo-text" class="text-green-400 font-black">6/6</span></div>
    <div id="p4-half" style="display:none" class="items-center gap-1 flex-1"><span class="font-black text-sky-400">P4</span><div class="flex-1 h-2.5 bg-slate-800 rounded-full overflow-hidden"><div id="p4-hp-fill" class="h-full bg-gradient-to-r from-sky-500 to-cyan-300 transition-all duration-150 w-full rounded-full"></div></div><span id="p4-ammo-text" class="text-sky-400 font-black">6/6</span></div>
  </div>

  <!-- Canvas wrapper -->
  <div class="relative w-full max-w-md flex-1 my-2 bg-slate-900 rounded-3xl overflow-hidden border-2 border-slate-800 shadow-2xl flex items-center justify-center">
    <canvas id="gameCanvas" width="450" height="700" class="w-full h-full block cursor-pointer touch-none object-contain"></canvas>

    <!-- Main Menu -->
    <div id="menu-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-between p-4 z-20 transition-opacity duration-300 overflow-y-auto">
      <div class="flex flex-col items-center text-center mt-2">
        <h1 class="font-orbitron text-3xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 bg-clip-text text-transparent glow-title">LET’S DUEL</h1>
        <p class="font-orbitron text-[10px] text-amber-400/90 tracking-widest uppercase font-semibold mt-1">Mobile Physics Arena</p>
        <p id="app-version" class="font-orbitron text-[9px] text-slate-500 mt-1"></p>
        <button id="install-btn" style="display:none" onclick="installApp()" class="mt-2 py-1.5 px-4 bg-emerald-500/20 border border-emerald-500 rounded-xl text-[10px] font-orbitron font-bold text-emerald-300 active:scale-95">⬇ INSTALL APP</button>
      </div>

      <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3 shadow-inner">
        <div class="text-[11px] font-orbitron text-amber-400 font-bold mb-2 flex justify-between items-center px-1">
          <span>SELECT WEAPON:</span>
          <span id="weapon-spec" class="text-slate-400 text-[9px]">REVOLVER (BALANCED)</span>
        </div>
        <div class="grid grid-cols-4 gap-1">
          <button onclick="selectWeapon('revolver')" id="btn-revolver" class="weapon-btn py-2.5 bg-amber-500/20 border-2 border-amber-500 rounded-xl text-[10px] font-orbitron font-black text-white active:scale-95 transition-all">REV</button>
          <button onclick="selectWeapon('shotgun')" id="btn-shotgun" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SG</button>
          <button onclick="selectWeapon('smg')" id="btn-smg" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SMG</button>
          <button onclick="selectWeapon('sniper')" id="btn-sniper" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SNP</button>
          <button onclick="selectWeapon('plasma')" id="btn-plasma" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">PLS</button>
          <button onclick="selectWeapon('sword')" id="btn-sword" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SWD</button>
          <button onclick="selectWeapon('shield')" id="btn-shield" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SHD</button>
          <button onclick="selectWeapon('rocket')" id="btn-rocket" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">RKT</button>
          <button onclick="selectWeapon('axe')" id="btn-axe" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">AXE</button>
          <button onclick="selectWeapon('crossbow')" id="btn-crossbow" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">XBW</button>
          <button onclick="selectWeapon('spear')" id="btn-spear" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SPR</button>
        </div>
      </div>

      <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-2 shadow-inner">
        <div class="text-[10px] font-orbitron text-slate-400 font-bold mb-1.5 px-1">BOT DIFFICULTY:</div>
        <div class="grid grid-cols-3 gap-1.5">
          <button onclick="selectDifficulty('easy')" id="diff-easy" class="diff-btn py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-bold text-slate-400 active:scale-95">EASY</button>
          <button onclick="selectDifficulty('normal')" id="diff-normal" class="diff-btn py-1.5 bg-amber-500/20 border-2 border-amber-500 rounded-xl text-[10px] font-orbitron font-bold text-amber-300 active:scale-95">NORMAL</button>
          <button onclick="selectDifficulty('pro')" id="diff-pro" class="diff-btn py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-bold text-slate-400 active:scale-95">PRO</button>
        </div>
      </div>

      <div class="flex flex-col gap-2 w-full mb-1">
        <button onclick="startGame('ai')" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl pulse-btn active:scale-95 transition-all text-sm tracking-wider">1 PLAYER (VS BOT)</button>
        <button onclick="startGame('pvp')" class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 text-white font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">2 PLAYERS (LOCAL DUEL)</button>
        <button onclick="showOnline(true)" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 text-white font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">🌐 2 PLAYERS (ONLINE)</button>
        <button onclick="startGame('ffa')" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">🔺 FREE FOR ALL (PvPvP)</button>
        <button onclick="startGame('ffa4')" class="w-full py-3.5 bg-gradient-to-r from-sky-400 to-cyan-500 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">🔷 FREE FOR ALL (PvPvPvP)</button>
      </div>
    </div>

    <!-- Online Panel -->
    <div id="online-panel" style="display:none" class="absolute inset-0 bg-slate-950 flex-col items-center justify-center gap-3 p-5 z-30">
      <h2 class="font-orbitron text-xl font-black text-sky-400 tracking-wider">ONLINE DUEL</h2>
      <p class="text-[10px] font-orbitron text-slate-400 text-center tracking-wide">PICK YOUR WEAPON ON THE MAIN MENU FIRST</p>
      <button onclick="hostGame()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm tracking-wider">HOST 2-PLAYER</button>
      <button onclick="hostGame(true)" class="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-slate-950 font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm tracking-wider">🔺 HOST 3-PLAYER (FFA)</button>
      <button onclick="hostGame(4)" class="w-full py-3 bg-gradient-to-r from-sky-400 to-cyan-500 text-slate-950 font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm tracking-wider">🔷 HOST 4-PLAYER (FFA)</button>
      <button id="start-btn" style="display:none" onclick="startFFA()" class="py-2 px-6 bg-green-500 text-slate-950 font-orbitron font-black rounded-xl active:scale-95 text-xs">▶ START MATCH</button>
      <div id="room-code" class="font-orbitron text-4xl font-black text-white tracking-[0.3em] h-10">----</div>
      <div id="share-btn" style="display:none" class="gap-2">
        <button onclick="shareRoom()" class="py-2 px-4 bg-emerald-500/20 border border-emerald-500 rounded-xl text-xs font-orbitron font-bold text-emerald-300 active:scale-95">📤 SHARE</button>
        <button onclick="copyInvite()" class="py-2 px-4 bg-indigo-500/20 border border-indigo-400 rounded-xl text-xs font-orbitron font-bold text-indigo-300 active:scale-95">📋 COPY (DISCORD)</button>
      </div>
      <div class="w-full h-px bg-slate-800"></div>
      <div class="flex gap-2 w-full">
        <input id="join-code" maxlength="4" placeholder="CODE" autocomplete="off" style="touch-action:auto;user-select:text;-webkit-user-select:text" class="flex-1 min-w-0 bg-slate-800 border border-slate-700 rounded-xl px-3 text-center font-orbitron text-lg uppercase text-white tracking-widest">
        <button onclick="joinGame()" class="px-5 py-3 bg-gradient-to-r from-rose-500 to-red-600 text-white font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm">JOIN</button>
      </div>
      <p id="net-status" class="text-[11px] font-orbitron text-sky-300 text-center min-h-[2.5em]"></p>
      <button onclick="showOnline(false)" class="py-2 px-6 bg-slate-800 border border-slate-700 text-slate-300 font-orbitron font-bold rounded-xl text-xs active:scale-95">BACK</button>
    </div>

    <!-- Gameover -->
    <div id="gameover-overlay" style="visibility:hidden" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 z-20 opacity-0 pointer-events-none transition-opacity duration-300">
      <h2 id="winner-text" class="font-orbitron text-3xl font-black mb-1 text-center tracking-wider bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent glow-title">PLAYER 1 WINS!</h2>
      <p class="text-slate-400 text-[10px] mb-6 font-orbitron tracking-widest uppercase">TOUCH BELOW TO REMATCH</p>
      <p class="text-slate-400 text-[10px] mb-1 font-orbitron tracking-widest uppercase">CHANGE WEAPON</p>
      <div id="go-weapons" class="grid grid-cols-4 gap-1 w-full mb-4"></div>
      <button onclick="resetGame()" class="py-3 px-8 bg-amber-400 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">PLAY AGAIN</button>
      <button onclick="location.reload()" class="mt-3 py-2 px-6 bg-slate-800 border border-slate-700 text-slate-300 font-orbitron font-bold rounded-xl text-xs active:scale-95">MENU</button>
    </div>
  </div>

  <!-- Touch controls -->
  <div class="w-full max-w-md grid grid-cols-2 gap-2 h-14 shrink-0 mb-1">
    <button id="p1-touch-btn" class="w-full h-full bg-amber-500/20 border-2 border-amber-500/80 rounded-2xl font-orbitron font-black text-amber-300 text-xs active:bg-amber-500 active:text-slate-950 transition-colors flex items-center justify-center gap-1 shadow-lg"><span class="text-sm">🔥</span> TAP P1 FIRE</button>
    <button id="p2-touch-btn" class="w-full h-full bg-rose-500/20 border-2 border-rose-500/80 rounded-2xl font-orbitron font-black text-rose-300 text-xs active:bg-rose-500 active:text-white transition-colors flex items-center justify-center gap-1 shadow-lg opacity-40 pointer-events-none">TAP P2 FIRE <span class="text-sm">🔥</span></button>
  </div>

  <script>
    const APP_VERSION = '23';
    document.getElementById('app-version').innerText = 'v' + APP_VERSION;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(() => {}));
    }
    let installPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); installPrompt = e;
      document.getElementById('install-btn').style.display = 'inline-block';
    });
    function installApp() {
      if (!installPrompt) return;
      installPrompt.prompt();
      installPrompt.userChoice.finally(() => { installPrompt = null; document.getElementById('install-btn').style.display = 'none'; });
    }
    window.addEventListener('appinstalled', () => { document.getElementById('install-btn').style.display = 'none'; });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const GUN_COLORS = ['#f59e0b', '#ef4444', '#22c55e', '#38bdf8'];
    const AIM_COLORS = ['rgba(245,158,11,0.35)', 'rgba(239,68,68,0.35)', 'rgba(34,197,94,0.35)', 'rgba(56,189,248,0.35)'];
    const PLAYER_NAMES = ['Player 1', 'Red Bot', 'Green Bot', 'Blue Bot'];
    const GUN_SCALE = 1.2;

    const poly = (pts, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); };
    const box = (x, y, w, h, fill) => { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); };
    const dot = (x, y, r, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
    
    const GUN_ART = {
      revolver(c) {
        poly([[-9, 2], [-3, 2], [-6, 16], [-15, 14]], '#92400e');
        box(-10, -5, 12, 10, '#4b5563');
        box(-3, -7, 12, 13, '#9ca3af');
        [0, 3, 6].forEach(x => box(x, -7, 1.2, 13, '#374151'));
        box(8, -3, 18, 5, '#6b7280');
        box(-13, -8, 4, 4, '#374151');
        box(-8, -4, 4, 3, c);
      },
      shotgun(c) {
        poly([[-8, -4], [-26, -2], [-28, 9], [-9, 6]], '#92400e');
        box(-8, -5, 16, 11, '#374151');
        box(6, -3, 30, 5, '#6b7280');
        box(6, 2, 26, 2.5, '#4b5563');
        box(12, 4.5, 14, 5, '#92400e');
        box(34, -4.5, 2, 8, '#9ca3af');
        box(-4, -3, 6, 2, c);
      },
      smg(c) {
        box(-12, -5, 30, 10, '#374151');
        box(-12, -8, 28, 3, '#9ca3af');
        box(18, -3, 10, 5, '#6b7280');
        box(22, -4.5, 2, 8, '#4b5563');
        box(2, 5, 6, 17, '#111827');
        box(-8, 5, 4, 8, '#374151');
        box(-6, -3, 4, 3, c);
      },
      sniper(c) {
        poly([[-10, -3], [-32, -1], [-34, 7], [-10, 4]], '#78350f');
        box(-10, -5, 22, 10, '#374151');
        box(12, -2, 38, 3.5, '#4b5563');
        box(4, -9, 16, 4, '#111827');
        dot(8, -11, 2.5, '#38bdf8');
        box(48, -3.5, 3, 6, '#9ca3af');
        box(-2, -3, 6, 2, c);
      },
      plasma(c) {
        box(-10, -7, 24, 14, '#1e293b');
        box(14, -4, 16, 8, '#0f172a');
        dot(22, 0, 5, '#38bdf8');
        box(-6, -5, 12, 10, '#334155');
        box(-2, -3, 4, 6, '#38bdf8');
      },
      sword(c) {
        box(-4, -3, 10, 6, '#b45309');
        box(-8, -9, 4, 18, '#d97706');
        box(6, -2, 54, 4, '#e2e8f0');
        poly([[56, -4], [64, 0], [56, 4]], '#f8fafc');
        box(2, -1, 4, 2, c);
      },
      shield(c) {
        poly([[0, -18], [14, -10], [14, 10], [0, 18], [-6, 10], [-6, -10]], '#334155');
        poly([[2, -14], [11, -8], [11, 8], [2, 14], [-3, 8], [-3, -8]], '#64748b');
        dot(4, 0, 6, c);
      },
      rocket(c) {
        box(-14, -7, 36, 14, '#374151');
        box(22, -9, 10, 18, '#ef4444');
        poly([[32, -9], [42, 0], [32, 9]], '#f97316');
        box(-16, -11, 4, 22, '#4b5563');
        box(-4, -4, 8, 8, c);
      },
      axe(c) {
        box(-6, -3, 14, 6, '#78350f');
        box(-4, -22, 6, 48, '#78350f');
        poly([[2, -26], [22, -18], [22, 18], [2, 26], [8, 12], [8, -12]], '#94a3b8');
        box(-2, -2, 4, 4, c);
      },
      crossbow(c) {
        box(-8, -4, 24, 8, '#78350f');
        poly([[12, -24], [16, 0], [12, 24]], '#475569');
        box(-4, -2, 18, 3, '#e2e8f0');
        box(-2, -3, 4, 6, c);
      },
      spear(c) {
        box(-12, -2, 56, 4, '#78350f');
        poly([[44, -6], [62, 0], [44, 6]], '#cbd5e1');
        box(-2, -3, 4, 6, c);
      }
    };

    // WEAPONS DEFINITION (Applying requested health & damage balances)
    const WEAPONS = {
      revolver: { name: 'REVOLVER', desc: 'BALANCED', type: 'ranged', maxHp: 130, ammo: 6, dmg: 28, speed: 13, cd: 450, spread: 0.03, color: '#f59e0b' },
      shotgun:  { name: 'SHOTGUN', desc: 'SPREAD BLAST', type: 'ranged', maxHp: 130, ammo: 2, dmg: 17, speed: 12, cd: 900, spread: 0.22, count: 5, color: '#ef4444' },
      smg:      { name: 'SMG', desc: 'RAPID FIRE', type: 'ranged', maxHp: 130, ammo: 25, dmg: 14, speed: 14, cd: 120, spread: 0.08, color: '#38bdf8' },
      sniper:   { name: 'SNIPER', desc: 'HEAVY PIERCE', type: 'ranged', maxHp: 130, ammo: 1, dmg: 110, speed: 24, cd: 1400, spread: 0.002, color: '#a855f7' },
      plasma:   { name: 'PLASMA', desc: 'ENERGY AOE', type: 'ranged', maxHp: 130, ammo: 8, dmg: 35, speed: 10, cd: 600, spread: 0.05, aoe: 55, color: '#06b6d4' },
      sword:    { name: 'SWORD', desc: 'MELEE DASH', type: 'melee', maxHp: 160, ammo: 99, dmg: 48, speed: 0, cd: 500, range: 45, color: '#eab308' },
      shield:   { name: 'SHIELD', desc: 'DEFENDER', type: 'melee', maxHp: 200, ammo: 99, dmg: 25, speed: 0, cd: 700, range: 40, block: true, color: '#64748b' },
      rocket:   { name: 'ROCKET', desc: 'EXPLOSIVE', type: 'ranged', maxHp: 130, ammo: 1, dmg: 90, speed: 9, cd: 1600, spread: 0.02, aoe: 85, knockback: 95, color: '#f97316' },
      axe:      { name: 'AXE', desc: 'HEAVY MELEE', type: 'melee', maxHp: 160, ammo: 99, dmg: 68, speed: 0, cd: 900, range: 50, color: '#dc2626' },
      crossbow: { name: 'CROSSBOW', desc: 'HIGH VELOCITY', type: 'ranged', maxHp: 130, ammo: 3, dmg: 52, speed: 18, cd: 700, spread: 0.01, color: '#84cc16' },
      spear:    { name: 'SPEAR', desc: 'REACH THRUST', type: 'melee', maxHp: 160, ammo: 99, dmg: 45, speed: 0, cd: 600, range: 65, color: '#14b8a6' }
    };

    let selectedWeaponKey = 'revolver';
    let botDifficulty = 'normal';
    let gameMode = 'ai'; // ai, pvp, ffa, ffa4, online
    let gameState = 'menu'; // menu, playing, gameover
    let players = [];
    let bullets = [];
    let particles = [];
    let floatingTexts = [];
    let obstacles = [];
    let p1TouchDown = false;
    let p2TouchDown = false;
    let gameLoopId = null;
    let soundEnabled = true;

    // Audio synth
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const t = ctx.currentTime;

        if (type === 'shoot') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(120, t);
          osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t);
          osc.stop(t + 0.1);
        } else if (type === 'explosion') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(90, t);
          osc.frequency.linearRampToValueAtTime(20, t + 0.3);
          gain.gain.setValueAtTime(0.5, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        } else if (type === 'reload') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, t);
          osc.frequency.setValueAtTime(800, t + 0.08);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
          osc.start(t);
          osc.stop(t + 0.15);
        }
      } catch (e) {}
    }
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').innerText = soundEnabled ? '🔊' : '🔇';
    }

    // UI Weapon select
    function selectWeapon(key) {
      selectedWeaponKey = key;
      document.querySelectorAll('.weapon-btn').forEach(b => {
        b.className = "weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all";
      });
      const btn = document.getElementById('btn-' + key);
      if (btn) {
        btn.className = "weapon-btn py-2.5 bg-amber-500/20 border-2 border-amber-500 rounded-xl text-[10px] font-orbitron font-black text-white active:scale-95 transition-all";
      }
      const w = WEAPONS[key];
      document.getElementById('weapon-spec').innerText = `${w.name} (${w.desc})`;
    }
    selectWeapon('revolver');

    function selectDifficulty(diff) {
      botDifficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(b => {
        b.className = "diff-btn py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-bold text-slate-400 active:scale-95";
      });
      const b = document.getElementById('diff-' + diff);
      if (b) {
        b.className = "diff-btn py-1.5 bg-amber-500/20 border-2 border-amber-500 rounded-xl text-[10px] font-orbitron font-bold text-amber-300 active:scale-95";
      }
    }

    // Populate game over weapon selector
    function buildGameOverWeapons() {
      const container = document.getElementById('go-weapons');
      if (!container) return;
      container.innerHTML = '';
      Object.keys(WEAPONS).forEach(key => {
        const btn = document.createElement('button');
        btn.className = "py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-[9px] font-orbitron font-bold text-slate-300 active:scale-95";
        btn.innerText = WEAPONS[key].name.substring(0, 3);
        btn.onclick = () => { selectWeapon(key); resetGame(); };
        container.appendChild(btn);
      });
    }
    buildGameOverWeapons();

    // Setup Arena obstacles
    function setupObstacles() {
      obstacles = [
        { x: W/2 - 50, y: H/2 - 12, w: 100, h: 24, vx: 0.8 },
        { x: W/4 - 30, y: H/3, w: 60, h: 16, vx: 0 },
        { x: (3*W)/4 - 30, y: (2*H)/3, w: 60, h: 16, vx: 0 }
      ];
    }

    // Player Class
    class Player {
      constructor(id, x, y, color, isBot, weaponKey) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 18;
        this.color = color;
        this.isBot = isBot;
        this.weaponKey = weaponKey;
        this.weapon = JSON.parse(JSON.stringify(WEAPONS[weaponKey]));
        this.hp = this.weapon.maxHp;
        this.maxHp = this.weapon.maxHp;
        this.ammo = this.weapon.ammo;
        this.angle = id === 0 ? -Math.PI/2 : Math.PI/2;
        this.targetAngle = this.angle;
        this.lastShot = 0;
        this.reloading = false;
        this.reloadTimer = 0;
        this.dashCooldown = 0;
        this.shieldActive = false;
        this.shieldTimer = 0;
      }

      update() {
        // Physics movement with safety boundary clamping
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.88;
        this.vy *= 0.88;

        this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
        this.y = Math.max(this.radius + 40, Math.min(H - this.radius - 40, this.y));

        if (this.dashCooldown > 0) this.dashCooldown--;
        if (this.shieldTimer > 0) {
          this.shieldTimer--;
          if (this.shieldTimer <= 0) this.shieldActive = false;
        }

        // Reload check
        if (this.reloading) {
          this.reloadTimer--;
          if (this.reloadTimer <= 0) {
            this.ammo = this.weapon.ammo;
            this.reloading = false;
          }
        }

        // Obstacle collision
        obstacles.forEach(obs => {
          obs.x += obs.vx;
          if (obs.x < 10 || obs.x + obs.w > W - 10) obs.vx *= -1;

          if (this.x + this.radius > obs.x && this.x - this.radius < obs.x + obs.w &&
              this.y + this.radius > obs.y && this.y - this.radius < obs.y + obs.h) {
            // Push out
            const dl = Math.abs(this.x + this.radius - obs.x);
            const dr = Math.abs(this.x - (obs.x + obs.w));
            const dt = Math.abs(this.y + this.radius - obs.y);
            const db = Math.abs(this.y - (obs.y + obs.h));
            const m = Math.min(dl, dr, dt, db);
            if (m === dl) this.x = obs.x - this.radius;
            else if (m === dr) this.x = obs.x + obs.w + this.radius;
            else if (m === dt) this.y = obs.y - this.radius;
            else if (m === db) this.y = obs.y + obs.h + this.radius;
          }
        });
      }

      fire(tx, ty) {
        const now = Date.now();
        if (now - this.lastShot < this.weapon.cd || this.reloading) return;

        if (this.ammo <= 0) {
          this.reloading = true;
          this.reloadTimer = 60; // 1 second reload
          playSound('reload');
          return;
        }

        this.ammo--;
        this.lastShot = now;
        playSound('shoot');

        const angle = Math.atan2(ty - this.y, tx - this.x);
        this.angle = angle;
        this.vx -= Math.cos(angle) * 3.5;
        this.vy -= Math.sin(angle) * 3.5;

        if (this.weapon.type === 'melee') {
          // Melee slash check
          players.forEach(p => {
            if (p.id !== this.id && p.hp > 0) {
              const dist = Math.hypot(p.x - this.x, p.y - this.y);
              if (dist < this.weapon.range + p.radius) {
                p.takeDamage(this.weapon.dmg, this.id);
                playSound('hit');
              }
            }
          });
        } else {
          // Ranged bullet(s)
          const count = this.weapon.count || 1;
          for (let i = 0; i < count; i++) {
            const spreadAngle = angle + (Math.random() - 0.5) * this.weapon.spread;
            bullets.push({
              x: this.x + Math.cos(spreadAngle) * 22,
              y: this.y + Math.sin(spreadAngle) * 22,
              vx: Math.cos(spreadAngle) * this.weapon.speed,
              vy: Math.sin(spreadAngle) * this.weapon.speed,
              dmg: this.weapon.dmg,
              aoe: this.weapon.aoe || 0,
              knockback: this.weapon.knockback || 0,
              owner: this.id,
              color: this.color
            });
          }
        }
      }

      takeDamage(amt, sourceId) {
        if (this.shieldActive && this.weapon.block) {
          amt *= 0.2; // Shield absorbs most damage
          floatingTexts.push({ x: this.x, y: this.y - 20, text: 'BLOCKED!', color: '#38bdf8', life: 30 });
        }
        this.hp -= amt;
        floatingTexts.push({ x: this.x, y: this.y - 15, text: `-${Math.round(amt)}`, color: '#ef4444', life: 35 });
        
        // Spawn hit particles
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: this.x, y: this.y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            color: this.color,
            life: 25
          });
        }

        if (this.hp <= 0) {
          this.hp = 0;
          checkGameOver();
        }
      }
    }

    // Start Game modes
    function startGame(mode) {
      gameMode = mode;
      gameState = 'playing';
      document.getElementById('menu-overlay').style.opacity = '0';
      setTimeout(() => document.getElementById('menu-overlay').style.display = 'none', 300);

      players = [];
      bullets = [];
      particles = [];
      floatingTexts = [];
      setupObstacles();

      // P1
      players.push(new Player(0, W/2, H - 90, GUN_COLORS[0], false, selectedWeaponKey));

      if (mode === 'ai') {
        // AI Bot weapon rotation
        const botWeapons = Object.keys(WEAPONS);
        const randWep = botWeapons[Math.floor(Math.random() * botWeapons.length)];
        players.push(new Player(1, W/2, 90, GUN_COLORS[1], true, randWep));
      } else if (mode === 'pvp') {
        players.push(new Player(1, W/2, 90, GUN_COLORS[1], false, selectedWeaponKey));
        document.getElementById('p2-touch-btn').style.opacity = '1';
        document.getElementById('p2-touch-btn').style.pointerEvents = 'auto';
      } else if (mode === 'ffa') {
        document.getElementById('p3-hud').style.display = 'flex';
        players.push(new Player(1, W/4, 90, GUN_COLORS[1], true, 'shotgun'));
        players.push(new Player(2, (3*W)/4, 90, GUN_COLORS[2], true, 'sniper'));
      } else if (mode === 'ffa4') {
        document.getElementById('p3-hud').style.display = 'flex';
        document.getElementById('p4-half').style.display = 'flex';
        players.push(new Player(1, W/4, 90, GUN_COLORS[1], true, 'shotgun'));
        players.push(new Player(2, (3*W)/4, 90, GUN_COLORS[2], true, 'sniper'));
        players.push(new Player(3, W/2, H/2, GUN_COLORS[3], true, 'plasma'));
      }

      updateHUD();
      if (!gameLoopId) {
        gameLoopId = requestAnimationFrame(gameLoop);
      }
    }

    function checkGameOver() {
      const alive = players.filter(p => p.hp > 0);
      if (alive.length <= 1) {
        gameState = 'gameover';
        const winner = alive.length === 1 ? alive[0] : null;
        const wText = winner ? `${PLAYER_NAMES[winner.id]} WINS!` : 'DRAW MATCH!';
        document.getElementById('winner-text').innerText = wText;
        const go = document.getElementById('gameover-overlay');
        go.style.visibility = 'visible';
        go.style.opacity = '1';
        go.style.pointerEvents = 'auto';
      }
    }

    function resetGame() {
      const go = document.getElementById('gameover-overlay');
      go.style.opacity = '0';
      go.style.pointerEvents = 'none';
      go.style.visibility = 'hidden';
      document.getElementById('menu-overlay').style.display = 'flex';
      setTimeout(() => document.getElementById('menu-overlay').style.opacity = '1', 50);
      gameState = 'menu';
    }

    // Touch & Mouse firing controls
    canvas.addEventListener('pointerdown', (e) => {
      if (gameState !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);

      if (gameMode === 'pvp') {
        // P1 controls bottom half, P2 controls top half
        if (y > H/2) players[0].fire(x, y);
        else players[1].fire(x, y);
      } else {
        players[0].fire(x, y);
      }
    });

    document.getElementById('p1-touch-btn').addEventListener('pointerdown', () => {
      if (gameState === 'playing' && players[0]) {
        // Fire straight ahead
        players[0].fire(players[0].x, players[0].y - 100);
      }
    });
    document.getElementById('p2-touch-btn').addEventListener('pointerdown', () => {
      if (gameState === 'playing' && players[1]) {
        players[1].fire(players[1].x, players[1].y + 100);
      }
    });

    // Main Game Loop
    function gameLoop() {
      ctx.clearRect(0, 0, W, H);

      // Draw background grid lines
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y < H; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Draw obstacles
      obstacles.forEach(obs => {
        ctx.fillStyle = '#334155';
        ctx.roundRect ? ctx.beginPath(), ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 6), ctx.fill() : ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // AI Logic update
      if (gameState === 'playing') {
        players.forEach(p => {
          if (p.isBot && p.hp > 0) {
            // Find closest target
            let target = null;
            let minDist = Infinity;
            players.forEach(tp => {
              if (tp.id !== p.id && tp.hp > 0) {
                const d = Math.hypot(tp.x - p.x, tp.y - p.y);
                if (d < minDist) { minDist = d; target = tp; }
              }
            });

            if (target) {
              // Smooth bot tracking & movement
              const angleToTarget = Math.atan2(target.y - p.y, target.x - p.x);
              p.angle = angleToTarget;

              if (Math.random() < (botDifficulty === 'easy' ? 0.02 : botDifficulty === 'normal' ? 0.05 : 0.09)) {
                p.fire(target.x, target.y);
              }
              // Drift slightly
              p.vx += (Math.random() - 0.5) * 0.8;
              p.vy += (Math.random() - 0.5) * 0.8;
            }
          }
          p.update();
        });
      }

      // Update & Render Bullets with glitch protection
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill();

        // Wall bounce / out of bounds removal
        if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
          bullets.splice(i, 1);
          continue;
        }

        // Bullet vs Player collision
        let hit = false;
        for (let j = 0; j < players.length; j++) {
          const p = players[j];
          if (p.id !== b.owner && p.hp > 0) {
            const dist = Math.hypot(p.x - b.x, p.y - b.y);
            if (dist < p.radius + 4) {
              hit = true;
              p.takeDamage(b.dmg, b.owner);

              // Apply rocket heavy knockback
              if (b.knockback) {
                p.vx += Math.cos(b.vx) * (b.knockback / 10);
                p.vy += Math.sin(b.vy) * (b.knockback / 10);
              }

              // AoE blast
              if (b.aoe) {
                playSound('explosion');
                players.forEach(tp => {
                  if (tp.id !== b.owner && tp.hp > 0) {
                    const ad = Math.hypot(tp.x - b.x, tp.y - b.y);
                    if (ad < b.aoe) {
                      tp.takeDamage(b.dmg * 0.6, b.owner);
                    }
                  }
                });
              }
              break;
            }
          }
        }
        if (hit) {
          bullets.splice(i, 1);
        }
      }

      // Render Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
        if (pt.life <= 0) particles.splice(i, 1);
      }

      // Render Floating Damage Texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.8;
        ft.life--;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 12px Orbitron, sans-serif';
        ctx.fillText(ft.text, ft.x - 12, ft.y);
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      // Render Players & Guns
      players.forEach(p => {
        if (p.hp <= 0) return;

        // Player body circle
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, 7); ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Gun artwork rotation
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.scale(GUN_SCALE, GUN_SCALE);
        const artFn = GUN_ART[p.weaponKey] || GUN_ART.revolver;
        artFn(p.color);
        ctx.restore();
      });

      updateHUD();

      if (gameState === 'playing' || gameState === 'gameover') {
        gameLoopId = requestAnimationFrame(gameLoop);
      }
    }

    function updateHUD() {
      if (players[0]) {
        const p1 = players[0];
        document.getElementById('p1-hp-fill').style.width = Math.max(0, (p1.hp / p1.maxHp) * 100) + '%';
        document.getElementById('p1-ammo-text').innerText = p1.reloading ? 'RELOAD' : `${p1.ammo}/${p1.weapon.ammo}`;
        document.getElementById('p1-gun-name').innerText = p1.weapon.name;
      }
      if (players[1]) {
        const p2 = players[1];
        document.getElementById('p2-hp-fill').style.width = Math.max(0, (p2.hp / p2.maxHp) * 100) + '%';
        document.getElementById('p2-ammo-text').innerText = p2.reloading ? 'RELOAD' : `${p2.ammo}/${p2.weapon.ammo}`;
        document.getElementById('p2-gun-name').innerText = p2.weapon.name;
      }
      if (players[2]) {
        const p3 = players[2];
        document.getElementById('p3-hp-fill').style.width = Math.max(0, (p3.hp / p3.maxHp) * 100) + '%';
        document.getElementById('p3-ammo-text').innerText = `${p3.ammo}/${p3.weapon.ammo}`;
      }
      if (players[3]) {
        const p4 = players[3];
        document.getElementById('p4-hp-fill').style.width = Math.max(0, (p4.hp / p4.maxHp) * 100) + '%';
        document.getElementById('p4-ammo-text').innerText = `${p4.ammo}/${p4.weapon.ammo}`;
      }
    }

    // Online PeerJS stub handling
    function showOnline(show) {
      document.getElementById('online-panel').style.display = show ? 'flex' : 'none';
    }
    function hostGame() {
      document.getElementById('net-status').innerText = "Connecting to matchmaking network...";
      setTimeout(() => {
        document.getElementById('room-code').innerText = "DUEL";
        document.getElementById('net-status').innerText = "Hosting room! Share code with your friend.";
        document.getElementById('share-btn').style.display = 'flex';
      }, 800);
    }
    function joinGame() {
      const code = document.getElementById('join-code').value;
      if (!code) return;
      document.getElementById('net-status').innerText = `Joining room ${code}...`;
      setTimeout(() => startGame('pvp'), 1000);
    }
    function shareRoom() {
      if (navigator.share) {
        navigator.share({ title: 'Let’s Duel', text: 'Join my physics duel room code: DUEL' });
      }
    }
    function copyInvite() {
      navigator.clipboard.writeText('Join my Let’s Duel room! Code: DUEL');
      document.getElementById('net-status').innerText = "Invite copied to clipboard!";
    }
  </script>

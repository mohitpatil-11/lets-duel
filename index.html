<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Let’s Duel</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Let’s Duel">
  <meta property="og:description" content="Physics shooter duel. Play vs a bot, locally, or online with friends!">
  <meta property="og:image" content="https://mohitpatil-11.github.io/lets-duel/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Let’s Duel">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700;900&display=swap');
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; background-color:#020617; }
    body { font-family:'Inter',sans-serif; }
    .font-orbitron { font-family:'Orbitron',sans-serif; }
    .glow-title { text-shadow:0 0 20px rgba(245,158,11,.6),0 0 35px rgba(239,68,68,.4); }
    .pulse-btn { animation:pulseGlow 1.8s infinite alternate; }
    @keyframes pulseGlow { 0%{box-shadow:0 0 12px rgba(245,158,11,.4);} 100%{box-shadow:0 0 25px rgba(245,158,11,.8);} }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-between p-2 select-none h-full w-full">

  <!-- Top HUD -->
  <div class="w-full max-w-md flex items-center justify-between px-3 py-2 bg-slate-900/90 border border-slate-800 rounded-2xl shadow-lg z-10 text-xs shrink-0 mt-1">
    <div class="flex items-center gap-2 w-[44%]">
      <div class="font-orbitron font-black text-amber-400 text-sm">P1</div>
      <div class="flex-1 flex flex-col gap-1">
        <div class="h-3.5 bg-slate-800 rounded-full border border-slate-700 overflow-hidden relative shadow-inner">
          <div id="p1-hp-fill" class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 transition-all duration-150 w-full rounded-full"></div>
        </div>
        <div class="flex justify-between items-center text-[10px] font-orbitron text-slate-300">
          <span id="p1-gun-name" class="font-bold truncate max-w-[60px]">REV</span>
          <span id="p1-ammo-text" class="text-amber-400 font-black">6/6</span>
        </div>
      </div>
    </div>
    <button id="sound-toggle" onclick="toggleSound()" class="px-2 py-1 text-xs font-orbitron text-slate-300 hover:text-white active:scale-95 transition-transform bg-slate-800 border border-slate-700 rounded-xl">🔊</button>
    <div class="flex items-center justify-end gap-2 w-[44%]">
      <div class="flex-1 flex flex-col gap-1 text-right">
        <div class="h-3.5 bg-slate-800 rounded-full border border-slate-700 overflow-hidden relative shadow-inner">
          <div id="p2-hp-fill" class="h-full bg-gradient-to-l from-rose-500 to-red-400 transition-all duration-150 w-full rounded-full"></div>
        </div>
        <div class="flex justify-between items-center text-[10px] font-orbitron text-slate-300">
          <span id="p2-ammo-text" class="text-rose-400 font-black">6/6</span>
          <span id="p2-gun-name" class="font-bold truncate max-w-[60px]">BOT</span>
        </div>
      </div>
      <div class="font-orbitron font-black text-rose-400 text-sm">P2</div>
    </div>
  </div>

  <div id="p3-hud" style="display:none" class="w-full max-w-md items-center gap-3 px-3 py-1 mt-1 bg-slate-900/90 border border-slate-800 rounded-2xl text-[10px] font-orbitron shrink-0">
    <div class="flex items-center gap-1 flex-1"><span class="font-black text-green-400">P3</span><div class="flex-1 h-2.5 bg-slate-800 rounded-full overflow-hidden"><div id="p3-hp-fill" class="h-full bg-gradient-to-r from-green-500 to-emerald-300 transition-all duration-150 w-full rounded-full"></div></div><span id="p3-ammo-text" class="text-green-400 font-black">6/6</span></div>
    <div id="p4-half" style="display:none" class="items-center gap-1 flex-1"><span class="font-black text-sky-400">P4</span><div class="flex-1 h-2.5 bg-slate-800 rounded-full overflow-hidden"><div id="p4-hp-fill" class="h-full bg-gradient-to-r from-sky-500 to-cyan-300 transition-all duration-150 w-full rounded-full"></div></div><span id="p4-ammo-text" class="text-sky-400 font-black">6/6</span></div>
  </div>

  <!-- Canvas wrapper -->
  <div class="relative w-full max-w-md flex-1 my-2 bg-slate-900 rounded-3xl overflow-hidden border-2 border-slate-800 shadow-2xl flex items-center justify-center">
    <canvas id="gameCanvas" width="450" height="700" class="w-full h-full block cursor-pointer touch-none object-contain"></canvas>

    <!-- Main Menu -->
    <div id="menu-overlay" class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-between p-4 z-20 transition-opacity duration-300 overflow-y-auto">
      <div class="flex flex-col items-center text-center mt-2">
        <h1 class="font-orbitron text-3xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 bg-clip-text text-transparent glow-title">LET’S DUEL</h1>
        <p class="font-orbitron text-[10px] text-amber-400/90 tracking-widest uppercase font-semibold mt-1">Mobile Physics Arena</p>
        <p id="app-version" class="font-orbitron text-[9px] text-slate-500 mt-1"></p>
        <button id="install-btn" style="display:none" onclick="installApp()" class="mt-2 py-1.5 px-4 bg-emerald-500/20 border border-emerald-500 rounded-xl text-[10px] font-orbitron font-bold text-emerald-300 active:scale-95">⬇ INSTALL APP</button>
      </div>

      <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3 shadow-inner">
        <div class="text-[11px] font-orbitron text-amber-400 font-bold mb-2 flex justify-between items-center px-1">
          <span>SELECT WEAPON:</span>
          <span id="weapon-spec" class="text-slate-400 text-[9px]">REVOLVER (BALANCED)</span>
        </div>
        <div class="grid grid-cols-4 gap-1">
          <button onclick="selectWeapon('revolver')" id="btn-revolver" class="weapon-btn py-2.5 bg-amber-500/20 border-2 border-amber-500 rounded-xl text-[10px] font-orbitron font-black text-white active:scale-95 transition-all">REV</button>
          <button onclick="selectWeapon('shotgun')" id="btn-shotgun" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SG</button>
          <button onclick="selectWeapon('smg')" id="btn-smg" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SMG</button>
          <button onclick="selectWeapon('sniper')" id="btn-sniper" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SNP</button>
          <button onclick="selectWeapon('plasma')" id="btn-plasma" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">PLS</button>
          <button onclick="selectWeapon('sword')" id="btn-sword" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SWD</button>
          <button onclick="selectWeapon('shield')" id="btn-shield" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">SHD</button>
          <button onclick="selectWeapon('rocket')" id="btn-rocket" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">RKT</button>
          <button onclick="selectWeapon('burst')" id="btn-burst" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">BRS</button>
          <button onclick="selectWeapon('axe')" id="btn-axe" class="weapon-btn py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-black text-slate-400 active:scale-95 transition-all">AXE</button>
        </div>
      </div>

      <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-2 shadow-inner">
        <div class="text-[10px] font-orbitron text-slate-400 font-bold mb-1.5 px-1">BOT DIFFICULTY:</div>
        <div class="grid grid-cols-3 gap-1.5">
          <button onclick="selectDifficulty('easy')" id="diff-easy" class="diff-btn py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-bold text-slate-400 active:scale-95">EASY</button>
          <button onclick="selectDifficulty('normal')" id="diff-normal" class="diff-btn py-1.5 bg-amber-500/20 border-2 border-amber-500 rounded-xl text-[10px] font-orbitron font-bold text-amber-300 active:scale-95">NORMAL</button>
          <button onclick="selectDifficulty('pro')" id="diff-pro" class="diff-btn py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-[10px] font-orbitron font-bold text-slate-400 active:scale-95">PRO</button>
        </div>
      </div>

      <div class="flex flex-col gap-2 w-full mb-1">
        <button onclick="startGame('ai')" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl pulse-btn active:scale-95 transition-all text-sm tracking-wider">1 PLAYER (VS BOT)</button>
        <button onclick="startGame('pvp')" class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 text-white font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">2 PLAYERS (LOCAL DUEL)</button>
        <button onclick="showOnline(true)" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 text-white font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">🌐 2 PLAYERS (ONLINE)</button>
        <button onclick="startGame('ffa')" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">🔺 FREE FOR ALL (PvPvP)</button>
        <button onclick="startGame('ffa4')" class="w-full py-3.5 bg-gradient-to-r from-sky-400 to-cyan-500 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">🔷 FREE FOR ALL (PvPvPvP)</button>
      </div>
    </div>

    <!-- Online Panel -->
    <div id="online-panel" style="display:none" class="absolute inset-0 bg-slate-950 flex-col items-center justify-center gap-3 p-5 z-30">
      <h2 class="font-orbitron text-xl font-black text-sky-400 tracking-wider">ONLINE DUEL</h2>
      <p class="text-[10px] font-orbitron text-slate-400 text-center tracking-wide">PICK YOUR WEAPON ON THE MAIN MENU FIRST</p>
      <button onclick="hostGame()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm tracking-wider">HOST 2-PLAYER</button>
      <button onclick="hostGame(true)" class="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-slate-950 font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm tracking-wider">🔺 HOST 3-PLAYER (FFA)</button>
      <button onclick="hostGame(4)" class="w-full py-3 bg-gradient-to-r from-sky-400 to-cyan-500 text-slate-950 font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm tracking-wider">🔷 HOST 4-PLAYER (FFA)</button>
      <button id="start-btn" style="display:none" onclick="startFFA()" class="py-2 px-6 bg-green-500 text-slate-950 font-orbitron font-black rounded-xl active:scale-95 text-xs">▶ START MATCH</button>
      <div id="room-code" class="font-orbitron text-4xl font-black text-white tracking-[0.3em] h-10">----</div>
      <div id="share-btn" style="display:none" class="gap-2">
        <button onclick="shareRoom()" class="py-2 px-4 bg-emerald-500/20 border border-emerald-500 rounded-xl text-xs font-orbitron font-bold text-emerald-300 active:scale-95">📤 SHARE</button>
        <button onclick="copyInvite()" class="py-2 px-4 bg-indigo-500/20 border border-indigo-400 rounded-xl text-xs font-orbitron font-bold text-indigo-300 active:scale-95">📋 COPY (DISCORD)</button>
      </div>
      <div class="w-full h-px bg-slate-800"></div>
      <div class="flex gap-2 w-full">
        <input id="join-code" maxlength="4" placeholder="CODE" autocomplete="off" style="touch-action:auto;user-select:text;-webkit-user-select:text" class="flex-1 min-w-0 bg-slate-800 border border-slate-700 rounded-xl px-3 text-center font-orbitron text-lg uppercase text-white tracking-widest">
        <button onclick="joinGame()" class="px-5 py-3 bg-gradient-to-r from-rose-500 to-red-600 text-white font-orbitron font-black rounded-2xl active:scale-95 transition-all text-sm">JOIN</button>
      </div>
      <p id="net-status" class="text-[11px] font-orbitron text-sky-300 text-center min-h-[2.5em]"></p>
      <button onclick="showOnline(false)" class="py-2 px-6 bg-slate-800 border border-slate-700 text-slate-300 font-orbitron font-bold rounded-xl text-xs active:scale-95">BACK</button>
    </div>

    <!-- Gameover -->
    <div id="gameover-overlay" style="visibility:hidden" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 z-20 opacity-0 pointer-events-none transition-opacity duration-300">
      <h2 id="winner-text" class="font-orbitron text-3xl font-black mb-1 text-center tracking-wider bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent glow-title">PLAYER 1 WINS!</h2>
      <p class="text-slate-400 text-[10px] mb-6 font-orbitron tracking-widest uppercase">TOUCH BELOW TO REMATCH</p>
      <p class="text-slate-400 text-[10px] mb-1 font-orbitron tracking-widest uppercase">CHANGE WEAPON</p>
      <div id="go-weapons" class="grid grid-cols-4 gap-1 w-full mb-4"></div>
      <button onclick="resetGame()" class="py-3 px-8 bg-amber-400 text-slate-950 font-orbitron font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-wider">PLAY AGAIN</button>
      <button onclick="location.reload()" class="mt-3 py-2 px-6 bg-slate-800 border border-slate-700 text-slate-300 font-orbitron font-bold rounded-xl text-xs active:scale-95">MENU</button>
    </div>
  </div>

  <!-- Touch controls -->
  <div class="w-full max-w-md grid grid-cols-2 gap-2 h-14 shrink-0 mb-1">
    <button id="p1-touch-btn" class="w-full h-full bg-amber-500/20 border-2 border-amber-500/80 rounded-2xl font-orbitron font-black text-amber-300 text-xs active:bg-amber-500 active:text-slate-950 transition-colors flex items-center justify-center gap-1 shadow-lg"><span class="text-sm">🔥</span> TAP P1 FIRE</button>
    <button id="p2-touch-btn" class="w-full h-full bg-rose-500/20 border-2 border-rose-500/80 rounded-2xl font-orbitron font-black text-rose-300 text-xs active:bg-rose-500 active:text-white transition-colors flex items-center justify-center gap-1 shadow-lg opacity-40 pointer-events-none">TAP P2 FIRE <span class="text-sm">🔥</span></button>
  </div>

  <script>
    // ---- App version: change this number every time you push an update ----
    const APP_VERSION = '14';
    document.getElementById('app-version').innerText = 'v' + APP_VERSION;

    // ---- PWA: offline support + install button ----
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(() => {}));
    }
    let installPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); installPrompt = e;
      document.getElementById('install-btn').style.display = 'inline-block';
    });
    function installApp() {
      if (!installPrompt) return;
      installPrompt.prompt();
      installPrompt.userChoice.finally(() => { installPrompt = null; document.getElementById('install-btn').style.display = 'none'; });
    }
    window.addEventListener('appinstalled', () => { document.getElementById('install-btn').style.display = 'none'; });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const GUN_COLORS = ['#f59e0b', '#ef4444', '#22c55e', '#38bdf8'];
    const AIM_COLORS = ['rgba(245,158,11,0.35)', 'rgba(239,68,68,0.35)', 'rgba(34,197,94,0.35)', 'rgba(56,189,248,0.35)'];
    const PLAYER_NAMES = ['Player 1', 'Red Bot', 'Green Bot', 'Blue Bot'];
    const GUN_SCALE = 1.2; // change this number to resize every gun (1.0 = original size)

    const gridCanvas = document.createElement('canvas');
    gridCanvas.width = W; gridCanvas.height = H;
    (function () {
      const g = gridCanvas.getContext('2d');
      g.strokeStyle = 'rgba(51,65,85,0.2)'; g.lineWidth = 1;
      for (let x = 0; x < W; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
      for (let y = 0; y < H; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    })();

    let isRunning = false;
    let gameMode = 'ai'; // 'ai' | 'pvp' | 'online-host' | 'online-guest'
    let aiDifficulty = 'normal';
    let lastTime = 0, timeScale = 1.0;
    let soundEnabled = true;
    let selectedWeaponType = 'revolver';
    let screenShakeTime = 0, screenShakeForce = 0;

    let bullets = [], particles = [], combatTexts = [], arenaPickups = [], bouncePads = [], obstacles = [];
    let player1, player2, player3 = null, player4 = null;

    const WEAPONS = {
      revolver: { name:'REVOLVER', damage:30, recoilForce:520, torqueKick:8, spinBase:1.5, mass:1.0, cooldown:0.35, maxAmmo:6, reloadTime:1.4, bulletSpeed:850, spread:0, pellets:1, color:'#f59e0b', spec:'REVOLVER (BALANCED)' },
      shotgun: { name:'SHOTGUN', damage:14, recoilForce:820, torqueKick:12, spinBase:1.7, mass:1.4, cooldown:0.65, maxAmmo:4, reloadTime:1.8, bulletSpeed:750, spread:0.22, pellets:4, color:'#ef4444', spec:'SHOTGUN (HEAVY KICK)' },
      smg: { name:'SMG', damage:14, recoilForce:300, torqueKick:5, spinBase:2.0, mass:0.8, cooldown:0.15, maxAmmo:12, reloadTime:1.2, bulletSpeed:820, spread:0.08, pellets:1, color:'#10b981', spec:'SMG (RAPID BURST)' },
      sniper: { name:'SNIPER', damage:60, recoilForce:1000, torqueKick:15, spinBase:1.2, mass:1.7, cooldown:0.85, maxAmmo:3, reloadTime:2.0, bulletSpeed:1300, spread:0, pellets:1, color:'#3b82f6', spec:'HEAVY SNIPER (HIGH DAMAGE)' },
      plasma: { name:'PLASMA', damage:40, recoilForce:650, torqueKick:9, spinBase:1.6, mass:1.1, cooldown:0.45, maxAmmo:5, reloadTime:1.5, bulletSpeed:650, spread:0, pellets:1, color:'#a855f7', spec:'PLASMA (ENERGY BLAST)' },
      sword: { name:'SWORD', damage:40, recoilForce:0, torqueKick:6, spinBase:2.4, mass:1.0, cooldown:0.6, maxAmmo:1, reloadTime:1, bulletSpeed:0, spread:0, pellets:0, melee:true, bladeLen:58, lungeForce:650, color:'#e2e8f0', spec:'SWORD (MELEE BLADE, NO SHOTS)' },
      shield: { name:'SHIELD', damage:12, recoilForce:250, torqueKick:4, spinBase:1.3, mass:1.6, cooldown:0.35, maxAmmo:6, reloadTime:1.4, bulletSpeed:850, spread:0, pellets:1, hp:160, shield:true, color:'#38bdf8', spec:'SHIELD (160 HP, REVOLVER SPEED)' },
      rocket: { name:'ROCKET', damage:55, recoilForce:900, torqueKick:12, spinBase:1.2, mass:1.5, cooldown:1.0, maxAmmo:2, reloadTime:2.2, bulletSpeed:520, spread:0, pellets:1, bulletRadius:8, color:'#fb923c', spec:'ROCKET (BIG HIT, SLOW RELOAD)' },
      burst: { name:'BURST', damage:16, recoilForce:420, torqueKick:7, spinBase:1.8, mass:1.0, cooldown:0.5, maxAmmo:9, reloadTime:1.5, bulletSpeed:900, spread:0.1, pellets:3, color:'#f472b6', spec:'BURST (3-SHOT FAN)' },
      axe: { name:'AXE', damage:55, recoilForce:0, torqueKick:6, spinBase:2.0, mass:1.2, cooldown:0.8, maxAmmo:1, reloadTime:1, bulletSpeed:0, spread:0, pellets:0, melee:true, style:'axe', bladeLen:60, bladeWidth:14, lungeForce:520, color:'#cbd5e1', spec:'AXE (WIDE SWING, HEAVY HIT)' }
    };

    // ---------- Audio ----------
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      tone(type, f0, f1, dur, vol) {
        if (!soundEnabled || !this.ctx) return;
        try {
          const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(f0, t);
          o.frequency.exponentialRampToValueAtTime(f1, t + dur);
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(); o.stop(t + dur);
        } catch (e) {}
      },
      playShoot(type) {
        const f = type === 'sniper' ? 450 : (type === 'shotgun' ? 200 : 320);
        this.tone(type === 'plasma' ? 'sine' : 'sawtooth', f, 30, 0.15, 0.25);
      },
      playHit() { this.tone('square', 160, 40, 0.1, 0.2); },
      playBounce() { this.tone('sine', 180, 500, 0.12, 0.2); },
      playPickup() { this.tone('triangle', 440, 880, 0.16, 0.2); }
    };

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function selectWeapon(type) {
      selectedWeaponType = type;
      document.querySelectorAll('.weapon-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500/20', 'border-2', 'border-amber-500', 'text-white');

      });
      if (netRole === 'guest') netSend({ t: 'weapon', w: type });
    }

    function selectDifficulty(diff) {
      aiDifficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500/20', 'border-2', 'border-amber-500', 'text-amber-300');
        btn.classList.add('bg-slate-800', 'border', 'border-slate-700', 'text-slate-400');
      });

        a.classList.add('bg-amber-500/20', 'border-2', 'border-amber-500', 'text-amber-300');

    // ---------- Entities ----------
    class FloatingText {
      constructor(x, y, text, color) { this.x = x; this.y = y; this.text = text; this.color = color; this.life = 0.8; this.maxLife = 0.8; }
      update(dt) { this.y -= 30 * dt; this.life -= dt; }
      draw() {
        ctx.save();
        ctx.font = '900 13px Orbitron';
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    class Bullet {
      constructor(x, y, vx, vy, isPlayer1, config) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.isPlayer1 = isPlayer1; this.config = config;
        this.radius = config.bulletRadius || (config.pellets > 1 ? 3 : 4); this.travel = 0;
        this.active = true; this.trail = [];
      }
      update(dt) {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > 5) this.trail.shift();
        this.x += this.vx * dt; this.y += this.vy * dt;
        if (this.config.range) { this.travel += Math.hypot(this.vx, this.vy) * dt; if (this.travel > this.config.range) { this.active = false; return; } }
        if (this.x < 10 || this.x > W - 10 || this.y < 10 || this.y > H - 10) {
          this.active = false;
          createSparks(this.x, this.y, '#cbd5e1');
        }
      }
      draw() {
        ctx.beginPath();
        this.trail.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
        ctx.strokeStyle = AIM_COLORS[this.owner !== undefined ? this.owner : (this.isPlayer1 ? 0 : 1)];
        ctx.lineWidth = this.radius * 1.5;
        ctx.stroke();
        ctx.fillStyle = this.config.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Particle {
      constructor(x, y, vx, vy, color, life) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color; this.life = life; this.maxLife = life; }
      update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.vy += 150 * dt; this.life -= dt; }
      draw() {
        const a = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color; ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(this.x, this.y, 2.5 * a, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    function createSparks(x, y, color) {
      for (let i = 0; i < 6; i++) {
        const ang = Math.random() * Math.PI * 2, spd = Math.random() * 140 + 30;
        particles.push(new Particle(x, y, Math.cos(ang) * spd, Math.sin(ang) * spd, color, 0.15 + Math.random() * 0.1));
      }
    }

    class PickupCrate {
      constructor(x, y, type) { this.x = x; this.y = y; this.type = type; this.size = 22; this.active = true; this.pulse = 0; }
      update(dt) { this.pulse += dt * 4; }
      draw() {
        if (!this.active) return;
        const h = this.type === 'health';
        ctx.save();
        ctx.translate(this.x, this.y);
        const fy = Math.sin(this.pulse) * 3;
        ctx.fillStyle = h ? 'rgba(16,185,129,0.25)' : 'rgba(245,158,11,0.25)';
        ctx.strokeStyle = h ? '#10b981' : '#f59e0b';
        ctx.lineWidth = 2;
        ctx.fillRect(-this.size / 2, -this.size / 2 + fy, this.size, this.size);
        ctx.strokeRect(-this.size / 2, -this.size / 2 + fy, this.size, this.size);
        ctx.fillStyle = h ? '#10b981' : '#f59e0b';
        ctx.font = '900 11px Orbitron';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(h ? '+' : '⚡', 0, fy);
        ctx.restore();
      }
    }

    class BouncePad {
      constructor(x, y, w, h, nx, ny) { this.x = x; this.y = y; this.w = w; this.h = h; this.nx = nx; this.ny = ny; this.anim = 0; }
      trigger() { this.anim = 0.2; AudioEngine.playBounce(); }
      update(dt) { if (this.anim > 0) this.anim -= dt; }
      draw() {
        ctx.save();
        ctx.fillStyle = this.anim > 0 ? '#38bdf8' : '#0284c7';
        ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 1.5;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.strokeRect(this.x, this.y, this.w, this.h);
        ctx.restore();
      }
    }

    class PhysicsGun {
      constructor(x, y, config, isPlayer1, idx = isPlayer1 ? 0 : 1) {
        this.x = x; this.y = y; this.vx = 0; this.vy = 0;
        this.config = config; this.isPlayer1 = isPlayer1; this.index = idx;
        this.angle = isPlayer1 ? -Math.PI / 4 : -Math.PI * 3 / 4;
        this.spinSpeed = config.spinBase * (isPlayer1 ? 1 : -1);
        this.bladeCD = [0, 0, 0, 0]; this.maxHp = config.hp || 100; this.hp = this.maxHp; this.ammo = config.maxAmmo;
        this.cooldown = 0; this.reloading = false; this.reloadTimer = 0;
        this.alive = true; this.radius = 18 * GUN_SCALE;
      }

      update(dt) {
        if (!this.alive) return;
        this.angle += this.spinSpeed * dt;
        this.spinSpeed *= Math.exp(-0.4 * dt);
        if (this.config.melee && Math.abs(this.spinSpeed) < 3) this.spinSpeed = (this.spinSpeed >= 0 ? 1 : -1) * 3; // blade keeps sweeping

        this.vy += 420 * dt;
        this.vx *= Math.exp(-0.75 * dt);
        this.vy *= Math.exp(-0.75 * dt);
        this.x += this.vx * dt; this.y += this.vy * dt;

        const margin = 22 * GUN_SCALE, bnc = 0.65;
        if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx) * bnc; this.spinSpeed *= -0.8; }
        if (this.x > W - margin) { this.x = W - margin; this.vx = -Math.abs(this.vx) * bnc; this.spinSpeed *= -0.8; }
        if (this.y < margin) { this.y = margin; this.vy = Math.abs(this.vy) * bnc; }
        if (this.y > H - margin - 10) { this.y = H - margin - 10; this.vy = -Math.abs(this.vy) * bnc; this.vx *= 0.85; }

        bouncePads.forEach(pad => {
          if (this.x > pad.x - 12 && this.x < pad.x + pad.w + 12 && this.y > pad.y - 12 && this.y < pad.y + pad.h + 12) {
            pad.trigger();
            if (pad.nx !== 0) this.vx = pad.nx * 580;
            if (pad.ny !== 0) this.vy = pad.ny * 680;
            this.spinSpeed = (Math.random() - 0.5) * 10;
          }
        });

        obstacles.forEach(obs => {
          if (this.x > obs.x - 12 && this.x < obs.x + obs.w + 12 && this.y > obs.y - 12 && this.y < obs.y + obs.h + 12) {
            this.vy = -Math.abs(this.vy) * 0.7;
            this.vx *= -0.7;
          }
        });

        arenaPickups.forEach(crate => {
          if (crate.active && Math.hypot(this.x - crate.x, this.y - crate.y) < this.radius + 12) {
            crate.active = false;
            AudioEngine.playPickup();
            if (crate.type === 'health') {
              this.hp = Math.min(this.maxHp, this.hp + 30);
              combatTexts.push(new FloatingText(this.x, this.y - 18, '+30 HP', '#10b981'));
            } else {
              this.ammo = this.config.maxAmmo; this.reloading = false;
              combatTexts.push(new FloatingText(this.x, this.y - 18, 'AMMO REFILL', '#f59e0b'));
            }
          }
        });

        if (this.cooldown > 0) this.cooldown -= dt;
        for (let i = 0; i < 4; i++) if (this.bladeCD[i] > 0) this.bladeCD[i] -= dt;
        if (this.reloading) {
          this.reloadTimer -= dt;
          if (this.reloadTimer <= 0) { this.reloading = false; this.ammo = this.config.maxAmmo; }
        }
      }

      shoot() {
        if (!this.alive || !isRunning) return;
        if (this.reloading || this.cooldown > 0) return;

        if (this.config.melee) { // sword: tap = lunge forward + fast swing, damage comes from the blade touching someone
          this.cooldown = this.config.cooldown;
          AudioEngine.tone('sawtooth', 520, 120, 0.12, 0.2);
          this.vx += Math.cos(this.angle) * this.config.lungeForce;
          this.vy += Math.sin(this.angle) * this.config.lungeForce;
          this.spinSpeed = (this.spinSpeed >= 0 ? 1 : -1) * (this.config.torqueKick + 8);
          screenShakeTime = 0.06; screenShakeForce = 1.5;
          return;
        }

        if (this.ammo <= 0) {
          this.reloading = true; this.reloadTimer = this.config.reloadTime;
          combatTexts.push(new FloatingText(this.x, this.y - 20, 'RELOADING', '#cbd5e1'));
          return;
        }

        this.ammo--;
        this.cooldown = this.config.cooldown;
        AudioEngine.playShoot(this.config.name.toLowerCase());

        const dirX = Math.cos(this.angle), dirY = Math.sin(this.angle);
        const recoil = this.config.recoilForce / this.config.mass;
        this.vx -= dirX * recoil; this.vy -= dirY * recoil;
        this.spinSpeed = (dirY > 0 ? 1 : -1) * this.config.torqueKick + (Math.random() * 3);

        const muzzleX = this.x + dirX * 26 * GUN_SCALE, muzzleY = this.y + dirY * 26 * GUN_SCALE;

        for (let i = 0; i < this.config.pellets; i++) {
          const sa = this.angle + (Math.random() - 0.5) * this.config.spread;
          const nb = new Bullet(muzzleX, muzzleY, Math.cos(sa) * this.config.bulletSpeed, Math.sin(sa) * this.config.bulletSpeed, this.isPlayer1, this.config);
          nb.owner = this.index;
          bullets.push(nb);
        }
        muzzleFlash(muzzleX, muzzleY, this.angle);

        screenShakeTime = 0.08;
        screenShakeForce = this.config.recoilForce * 0.004;

        if (this.ammo <= 0) { this.reloading = true; this.reloadTimer = this.config.reloadTime; }
      }

      draw() {
        if (!this.alive) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(this.angle) * 140, Math.sin(this.angle) * 140);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.rotate(this.angle);
        ctx.scale(GUN_SCALE, GUN_SCALE);
        if (this.config.melee && this.config.style === 'axe') { // axe: wooden handle + double-bladed head
          const BL = this.config.bladeLen;
          ctx.fillStyle = '#92400e'; ctx.fillRect(-14, -3, BL + 2, 6);
          ctx.fillStyle = GUN_COLORS[this.index]; ctx.fillRect(-8, -3, 16, 6);
          ctx.fillStyle = '#cbd5e1'; ctx.beginPath();
          ctx.moveTo(BL - 18, -3); ctx.lineTo(BL - 10, -22); ctx.lineTo(BL + 8, -18); ctx.lineTo(BL + 8, 18); ctx.lineTo(BL - 10, 22); ctx.lineTo(BL - 18, 3); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5; ctx.stroke();
        } else if (this.config.melee) { // sword: pommel, grip, crossguard, pointed blade
          const BL = this.config.bladeLen;
          ctx.fillStyle = '#334155'; ctx.fillRect(-14, -4, 8, 8);
          ctx.fillStyle = GUN_COLORS[this.index]; ctx.fillRect(-8, -3, 16, 6);
          ctx.fillStyle = '#facc15'; ctx.fillRect(8, -11, 5, 22);
          ctx.fillStyle = '#e2e8f0'; ctx.beginPath();
          ctx.moveTo(13, -5); ctx.lineTo(BL, -2); ctx.lineTo(BL + 10, 0); ctx.lineTo(BL, 2); ctx.lineTo(13, 5); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(BL, 0); ctx.stroke();
        } else {
          ctx.fillStyle = GUN_COLORS[this.index];
          ctx.fillRect(-8, -5, 26, 10);
          ctx.fillStyle = '#94a3b8'; ctx.fillRect(6, -3, 18, 6);
          ctx.fillStyle = '#334155'; ctx.fillRect(-5, 3, 10, 13);
        }
        if (this.config.shield) { ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, 30, -1.0, 1.0); ctx.stroke(); }
        ctx.restore();

        if (this.reloading) {
          ctx.save();
          ctx.beginPath();
          const progress = 1 - (this.reloadTimer / this.config.reloadTime);
          ctx.arc(this.x, this.y - 26 * GUN_SCALE, 8, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
          ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.restore();
        }
      }
    }

    function muzzleFlash(x, y, angle) {
      for (let k = 0; k < 5; k++) {
        const pa = angle + (Math.random() - 0.5) * 0.4, ps = Math.random() * 180 + 60;
        particles.push(new Particle(x, y, Math.cos(pa) * ps, Math.sin(pa) * ps, '#fef08a', 0.12));
      }
    }

    // ---------- AI ----------
    function updateAI(dt, bot = player2, foes = [player1]) {
      if (!bot || !bot.alive) return;
      const alive = foes.filter(f => f && f.alive);
      if (!alive.length) return;
      const t = alive.reduce((a, b) => Math.hypot(a.x - bot.x, a.y - bot.y) < Math.hypot(b.x - bot.x, b.y - bot.y) ? a : b);
      const targetAngle = Math.atan2(t.y - bot.y, t.x - bot.x);
      let angleDiff = Math.abs(bot.angle - targetAngle);
      while (angleDiff > Math.PI * 2) angleDiff -= Math.PI * 2;
      if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
      const threshold = aiDifficulty === 'pro' ? 0.45 : (aiDifficulty === 'normal' ? 0.35 : 0.25);
      const hitChance = aiDifficulty === 'pro' ? 0.9 : (aiDifficulty === 'normal' ? 0.7 : 0.45);
      if (angleDiff < threshold && bot.cooldown <= 0 && !bot.reloading) {
        if (Math.random() < hitChance) bot.shoot();
      }
    }

    function setupEnvironment() {
      bouncePads = [
        new BouncePad(0, H / 2 - 40, 14, 80, 1, 0),
        new BouncePad(W - 14, H / 2 - 40, 14, 80, -1, 0),
        new BouncePad(W / 2 - 50, H - 14, 100, 14, 0, -1)
      ];
      obstacles = [{ x: W / 2 - 45, y: H / 3, w: 90, h: 18 }];
    }

    // ---------- Game flow ----------
    let netP1Weapon = 'revolver', netP2Weapon = 'revolver', netP3Weapon = 'revolver', netP4Weapon = 'revolver';
    let netFFA = 0, mySlot = 1, slotConn = [null, null, null, null], netWeapons = ['revolver', 'revolver', 'revolver', 'revolver'];
    function soloFFA() { return gameMode === 'ffa' || gameMode === 'ffa4'; }
    function ffaN() { return gameMode === 'ffa' ? 3 : gameMode === 'ffa4' ? 4 : ((gameMode === 'online-host' || gameMode === 'online-guest') ? netFFA : 0); }
    function isFFA() { return ffaN() > 0; }
    function isBotSlot(i) { return soloFFA() || (netFFA && !slotConn[i]); }
    function nameOf(i) { return i > 0 && isBotSlot(i) ? PLAYER_NAMES[i] : 'Player ' + (i + 1); }

    function startGame(mode) {
      AudioEngine.init();
      gameMode = mode;
      const isNet = mode === 'online-host' || mode === 'online-guest';

      document.getElementById('menu-overlay').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('gameover-overlay').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('online-panel').style.display = 'none';
      document.getElementById('menu-overlay').style.visibility = 'hidden';
      document.getElementById('gameover-overlay').style.visibility = 'hidden';
      lastSeq = 0;
      keepAwake();

      setupEnvironment();

      const p1Config = isNet ? WEAPONS[netP1Weapon] : WEAPONS[selectedWeaponType];
      const p2Config = isNet ? WEAPONS[netP2Weapon] : (mode === 'pvp' ? WEAPONS[selectedWeaponType] : WEAPONS['revolver']);

      player1 = new PhysicsGun(100, 200, p1Config, true);
      player2 = new PhysicsGun(W - 100, 200, p2Config, false);
      const n = ffaN();
      player3 = n >= 3 ? new PhysicsGun(n === 4 ? 100 : W / 2, 450, isNet ? WEAPONS[netP3Weapon] : WEAPONS['revolver'], false, 2) : null;
      player4 = n >= 4 ? new PhysicsGun(W - 100, 450, isNet ? WEAPONS[netP4Weapon] : WEAPONS['revolver'], false, 3) : null;
      if (player3) { player3.angle = -Math.PI / 2; player3.spinSpeed = 1.5; }
      if (player4) { player4.angle = -Math.PI / 2; player4.spinSpeed = -1.5; }
      document.getElementById('p3-hud').style.display = n >= 3 ? 'flex' : 'none';
      document.getElementById('p4-half').style.display = n >= 4 ? 'flex' : 'none';

      bullets = []; particles = []; combatTexts = []; arenaPickups = [];
      koActive = false; gameEnding = false;

      document.getElementById('p1-gun-name').innerText = p1Config.name.substring(0, 4);
      document.getElementById('p2-gun-name').innerText = (mode === 'ai' || mode === 'ffa' || mode === 'ffa4') ? 'BOT' : p2Config.name.substring(0, 4);

      // Which fire buttons are usable on THIS device
      const p1Btn = document.getElementById('p1-touch-btn');
      const p2Btn = document.getElementById('p2-touch-btn');
      const p1On = mode !== 'online-guest';
      const p2On = mode === 'pvp' || mode === 'online-guest';
      p1Btn.classList.toggle('opacity-40', !p1On); p1Btn.classList.toggle('pointer-events-none', !p1On);
      p2Btn.classList.toggle('opacity-40', !p2On); p2Btn.classList.toggle('pointer-events-none', !p2On);
      if (mode === 'online-guest') p2Btn.innerHTML = '🔥 TAP TO FIRE (YOU = P' + (mySlot + 1) + ')';
      else p2Btn.innerHTML = 'TAP P2 FIRE <span class="text-sm">🔥</span>';
      if (mode === 'online-host') p1Btn.innerHTML = '<span class="text-sm">🔥</span> TAP TO FIRE (YOU = P1)';
      else p1Btn.innerHTML = '<span class="text-sm">🔥</span> TAP P1 FIRE';

      if (mode === 'online-host') sendStart();

      const wasRunning = isRunning;
      isRunning = true;
      timeScale = 1.0;
      lastTime = performance.now();
      updateHUD();
      if (!wasRunning) requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      if (netRole === 'host' && gameMode === 'online-host') { if (netFFA) refreshWeapons(); else netP1Weapon = selectedWeaponType; }
      if (gameMode === 'online-guest') {
        netSend({ t: 'rematch' });
        document.getElementById('winner-text').innerText = 'WAITING FOR HOST...';
        return;
      }
      startGame(gameMode);
    }

    function showGameOver(text) {
      document.getElementById('winner-text').innerText = text;
      document.getElementById('gameover-overlay').style.visibility = 'visible';
      document.getElementById('gameover-overlay').classList.remove('opacity-0', 'pointer-events-none');
    }

    // Knockout cinematic: slow-mo, zoom on the loser, flash, "K.O." text, burst
    let koActive = false, koX = 0, koY = 0, koStart = 0, gameEnding = false;
    function startKO(x, y) {
      koActive = true; koX = x; koY = y; koStart = performance.now();
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2, s = Math.random() * 320 + 60;
        particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, i % 2 ? '#fef08a' : '#ef4444', 0.6 + Math.random() * 0.4));
      }
      screenShakeTime = 0.3; screenShakeForce = 4;
      AudioEngine.tone('sawtooth', 120, 25, 0.5, 0.3);
    }

    function triggerVictory(winnerName, loser) {
      if (gameEnding) return;
      gameEnding = true;
      timeScale = 0.2;
      if (loser) startKO(loser.x, loser.y);
      setTimeout(() => {
        isRunning = false;
        if (gameMode === 'online-host') netSend({ t: 'over', w: winnerName });
        showGameOver(winnerName.toUpperCase() + ' WINS!');
      }, 1800);
    }

    const hudCache = {};
    function updateHUD() {
      if (!player1 || !player2) return;
      [player1, player2, player3, player4].forEach((p, i) => {
        if (!p) return;
        const n = i + 1;
        const w = Math.max(0, Math.ceil(p.hp / p.maxHp * 100)) + '%';
        const a = p.config.melee ? 'BLADE' : p.reloading ? 'RELOAD' : `${p.ammo}/${p.config.maxAmmo}`;
        if (hudCache['w' + n] !== w) { hudCache['w' + n] = w; document.getElementById('p' + n + '-hp-fill').style.width = w; }
        if (hudCache['a' + n] !== a) { hudCache['a' + n] = a; document.getElementById('p' + n + '-ammo-text').innerText = a; }
      });
    }

    // ---------- Input ----------
    // who: 1 or 2. Routes the shot locally or over the network depending on mode.
    function fireLocal(who) {
      if (gameMode === 'online-guest') {
        if (who === 2 && isRunning) netSend({ t: 'fire' });
        return;
      }
      if (gameMode === 'online-host') { if (who === 1 && player1) player1.shoot(); return; }
      if (who === 1 && player1) player1.shoot();
      else if (who === 2 && gameMode === 'pvp' && player2) player2.shoot();
    }

    document.getElementById('p1-touch-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); AudioEngine.init(); fireLocal(1); });
    document.getElementById('p2-touch-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); AudioEngine.init(); fireLocal(2); });

    window.addEventListener('keydown', (e) => {
      if (e.target && e.target.tagName === 'INPUT') return;
      AudioEngine.init();
      if (e.code === 'KeyW' || e.code === 'Space') { e.preventDefault(); fireLocal(gameMode === 'online-guest' ? 2 : 1); }
      if (e.code === 'ArrowUp') { e.preventDefault(); fireLocal(2); }
    });

    canvas.addEventListener('pointerdown', (e) => {
      AudioEngine.init();
      if (!isRunning) return;
      if (gameMode === 'online-guest') { fireLocal(2); return; }
      if (gameMode === 'online-host') { fireLocal(1); return; }
      const rect = canvas.getBoundingClientRect();
      fireLocal(gameMode === 'pvp' && (e.clientX - rect.left) > rect.width / 2 ? 2 : 1);
    });

    // ---------- Online multiplayer (PeerJS / WebRTC) ----------
    // Host runs the whole simulation. Guest only sends "fire" and draws snapshots.
    let peer = null, conn = null, netRole = null, lastSend = 0, bulletIdSeq = 0, snapSeq = 0, lastSeq = 0;

    // TURN relay: needed when the two players are on different networks.
    // Get a free key at https://www.metered.ca/tools/openrelay/ and paste it here.
    const METERED_APP = 'pistol-duel-mohit'; // your Metered app name (from the dashboard)
    const METERED_API_KEY = (window.PD_CONFIG && window.PD_CONFIG.meteredKey) || '';
    async function getIce() {
      const fallback = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
      ];
      if (!METERED_API_KEY) return fallback;
      try {
        const r = await fetch('https://' + METERED_APP + '.metered.live/api/v1/turn/credentials?apiKey=' + METERED_API_KEY);
        const list = await r.json();
        if (Array.isArray(list) && list.length) return list;
      } catch (e) {}
      return fallback;
    }

    let wakeLock = null;
    async function keepAwake() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (netRole || isRunning) keepAwake();
      if (peer && !peer.destroyed && peer.disconnected) { netStatus('Reconnecting...'); peer.reconnect(); }
    });

    function copyInvite() {
      const code = document.getElementById('room-code').innerText;
      if (code.length !== 4) return;
      const text = 'Join my Let’s Duel match! Room code: ' + code + ' ' + location.origin + location.pathname + '?room=' + code;
      const done = () => netStatus('Invite copied! Paste it in Discord, WhatsApp or anywhere.');
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { netStatus('Could not copy. Share the code ' + code + ' by hand.'); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
      else fallback();
    }

    function shareRoom() {
      const code = document.getElementById('room-code').innerText;
      if (code.length !== 4) return;
      const url = location.origin + location.pathname + '?room=' + code;
      const text = 'Join my Let’s Duel match! Room code: ' + code;
      if (navigator.share) {
        navigator.share({ title: 'Let’s Duel', text, url }).catch(() => {});
      } else {
        copyInvite();
      }
    }

    function netSend(m) {
      if (netFFA && netRole === 'host') { slotConn.forEach(c => { if (c && c.open) { try { c.send(m); } catch (e) {} } }); return; }
      if (conn && conn.open) { try { conn.send(m); } catch (e) {} }
    }

    // ---- 3-player online (host = P1, guests = P2 / P3, empty seats = bots) ----
    function updateLobby() {
      const n = slotConn.filter(Boolean).length;
      netStatus('Players: ' + (n + 1) + '/' + netFFA + '. Share the invite, then tap START. Empty seats become bots.');
    }
    function refreshWeapons() {
      netP1Weapon = selectedWeaponType;
      netP2Weapon = slotConn[1] ? netWeapons[1] : 'revolver';
      netP3Weapon = slotConn[2] ? netWeapons[2] : 'revolver';
      netP4Weapon = slotConn[3] ? netWeapons[3] : 'revolver';
    }
    function startFFA() {
      if (!netFFA || netRole !== 'host') return;
      refreshWeapons();
      startGame('online-host');
    }
    function sendStart() {
      const base = { t: 'start', p1: netP1Weapon, p2: netP2Weapon, p3: netP3Weapon, p4: netP4Weapon, ffa: netFFA };
      if (netFFA) slotConn.forEach((c, i) => { if (c && c.open) { try { c.send({ ...base, slot: i }); } catch (e) {} } });
      else netSend(base);
    }
    function addGuest(c) {
      const slot = [1, 2, 3].find(i => i < netFFA && !slotConn[i]);
      if (!slot || isRunning) { c.close(); return; }
      slotConn[slot] = c;
      c.on('data', (m) => {
        if (m.t === 'hello') { netWeapons[slot] = WEAPONS[m.w] ? m.w : 'revolver'; updateLobby(); }
        else if (m.t === 'fire') { const g = [player1, player2, player3, player4][slot]; if (gameMode === 'online-host' && g) g.shoot(); }
        else if (m.t === 'weapon' && WEAPONS[m.w]) netWeapons[slot] = m.w;
        else if (m.t === 'rematch' && gameMode === 'online-host' && !isRunning) resetGame();
      });
      const gone = () => { if (slotConn[slot] === c) { slotConn[slot] = null; if (!isRunning) updateLobby(); } };
      c.on('close', gone); c.on('error', gone);
      updateLobby();
    }
    function netStatus(t) { document.getElementById('net-status').innerText = t; }

    function showOnline(show) {
      document.getElementById('online-panel').style.display = show ? 'flex' : 'none';
      if (!show) cleanupNet();
    }

    function cleanupNet() {
      if (conn) { try { conn.close(); } catch (e) {} }
      if (peer) { try { peer.destroy(); } catch (e) {} }
      conn = null; peer = null; netRole = null; netFFA = 0; slotConn = [null, null, null, null];
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('room-code').innerText = '----';
      document.getElementById('share-btn').style.display = 'none';
      netStatus('');
    }

    async function hostGame(ffa = false) {
      cleanupNet();
      netRole = 'host'; netFFA = ffa === 4 ? 4 : (ffa ? 3 : 0);
      const code = Math.random().toString(36).replace(/[^a-z]/g, '').slice(0, 4).toUpperCase().padEnd(4, 'X');
      netStatus('Creating room...');
      peer = new Peer('pduel-' + code, { config: { iceServers: await getIce() } });
      peer.on('open', () => {
        document.getElementById('room-code').innerText = code;
        document.getElementById('share-btn').style.display = 'flex';
        document.getElementById('start-btn').style.display = netFFA ? 'inline-block' : 'none';
        if (netFFA) updateLobby(); else netStatus('Tap SHARE or COPY and send the invite to your friend. Waiting...');
        keepAwake();
      });
      // If the phone switches apps (e.g. to WhatsApp), the link to the matchmaking server can drop.
      // Reconnecting keeps the same room code working.
      peer.on('disconnected', () => {
        if (peer && !peer.destroyed && document.visibilityState === 'visible') peer.reconnect();
      });
      peer.on('error', (e) => netStatus(e.type === 'unavailable-id' ? 'Code taken, tap HOST again' : 'Error: ' + e.type));
      peer.on('connection', (c) => {
        if (netFFA) { addGuest(c); return; }
        if (conn && conn.open) { c.close(); return; }
        conn = c;
        setupConn();
      });
    }

    async function joinGame() {
      const code = document.getElementById('join-code').value.trim().toUpperCase();
      if (code.length < 4) { netStatus('Enter the 4-letter code'); return; }
      cleanupNet();
      netRole = 'guest';
      netStatus('Connecting...');
      peer = new Peer(undefined, { config: { iceServers: await getIce() } });
      peer.on('open', () => {
        conn = peer.connect('pduel-' + code, { serialization: 'json' });
        setupConn();
        setTimeout(() => { if (conn && !conn.open && !isRunning) netStatus('Still not connected. Check the code, or the network may be blocking it. Try again.'); }, 15000);
      });
      peer.on('error', (e) => netStatus(e.type === 'peer-unavailable' ? 'Room not found' : 'Error: ' + e.type));
    }

    function setupConn() {
      conn.on('open', () => {
        if (netRole === 'guest') { netStatus('Connected! Waiting for host...'); netSend({ t: 'hello', w: selectedWeaponType }); }
      });
      conn.on('data', handleNet);
      conn.on('close', onNetClose);
      conn.on('error', onNetClose);
    }

    function onNetClose() {
      if (!netRole) return;
      const playing = isRunning;
      isRunning = false; conn = null;
      netStatus('Disconnected');
      if (playing) showGameOver('OPPONENT LEFT');
    }

    function handleNet(m) {
      switch (m.t) {
        case 'hello': // host: guest joined
          if (netRole !== 'host') return;
          netP1Weapon = selectedWeaponType;
          netP2Weapon = WEAPONS[m.w] ? m.w : 'revolver';
          startGame('online-host');
          break;
        case 'start': // guest: host started a round
          if (netRole !== 'guest') return;
          netP1Weapon = m.p1; netP2Weapon = m.p2; netP3Weapon = m.p3 || 'revolver'; netP4Weapon = m.p4 || 'revolver'; netFFA = m.ffa | 0; mySlot = m.slot || 1;
          startGame('online-guest');
          break;
        case 's':
          if (gameMode === 'online-guest' && isRunning && m.n > lastSeq) { lastSeq = m.n; applySnapshot(m); }
          break;
        case 'fire':
          if (gameMode === 'online-host' && player2) player2.shoot();
          break;
        case 'over':
          if (netRole === 'guest') { isRunning = false; showGameOver(m.w.toUpperCase() + ' WINS!'); }
          break;
        case 'weapon':
          if (netRole === 'host' && WEAPONS[m.w]) netP2Weapon = m.w;
          break;
        case 'rematch':
          if (gameMode === 'online-host') resetGame();
          break;
      }
    }

    // Host -> guest state
    function makeSnapshot() {
      const g = p => [Math.round(p.x), Math.round(p.y), Math.round(p.vx), Math.round(p.vy), +p.angle.toFixed(3), +p.spinSpeed.toFixed(2),
                      Math.round(p.hp), p.ammo, p.reloading ? 1 : 0, +p.reloadTimer.toFixed(2), p.alive ? 1 : 0];
      return {
        t: 's', n: ++snapSeq, ts: timeScale, p1: g(player1), p2: g(player2), p3: player3 ? g(player3) : null, p4: player4 ? g(player4) : null, end: gameEnding ? 1 : 0,
        b: bullets.filter(b => b.active).map(b => [b.id || (b.id = ++bulletIdSeq), Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy), b.isPlayer1 ? 1 : 0, b.config.name.toLowerCase()]),
        c: arenaPickups.filter(c => c.active).map(c => [Math.round(c.x), Math.round(c.y), c.type])
      };
    }

    // Guest: apply host state, and trigger sounds/FX by comparing with previous state
    function applySnapshot(s) {
      if (!player1 || !player2) return;
      timeScale = s.ts || 1;
      [[player1, s.p1], [player2, s.p2], ...(s.p3 && player3 ? [[player3, s.p3]] : []), ...(s.p4 && player4 ? [[player4, s.p4]] : [])].forEach(([p, a]) => {
        const [x, y, vx, vy, ang, sp, hp, ammo, rl, rt, al] = a;
        if (p.alive && !al) { startKO(x, y); if (s.p3 && !s.end) koActive = false; }
        if (ammo < p.ammo) {
          AudioEngine.playShoot(p.config.name.toLowerCase());
          screenShakeTime = 0.08; screenShakeForce = p.config.recoilForce * 0.004;
          muzzleFlash(p.x + Math.cos(p.angle) * 26 * GUN_SCALE, p.y + Math.sin(p.angle) * 26 * GUN_SCALE, p.angle);
        }
        if (hp < p.hp) {
          AudioEngine.playHit();
          createSparks(x, y, '#ef4444');
          combatTexts.push(new FloatingText(x, y - 12, `-${Math.round(p.hp - hp)}`, '#ef4444'));
        } else if (hp > p.hp) {
          AudioEngine.playPickup();
          combatTexts.push(new FloatingText(x, y - 18, `+${Math.round(hp - p.hp)} HP`, '#10b981'));
        }
        if (p.tx === undefined || Math.hypot(x - p.x, y - p.y) > 80) { p.x = x; p.y = y; p.angle = ang; }
        p.tx = x; p.ty = y; p.tAng = ang;
        p.vx = vx; p.vy = vy; p.spinSpeed = sp;
        p.hp = hp; p.ammo = ammo; p.reloading = !!rl; p.reloadTimer = rt; p.alive = !!al;
      });

      const oldB = new Map(bullets.map(b => [b.id, b]));
      bullets = s.b.map(([id, x, y, vx, vy, p1, w]) => {
        let b = oldB.get(id);
        if (b) { b.tx = x; b.ty = y; b.vx = vx; b.vy = vy; b.active = true; return b; }
        b = new Bullet(x, y, vx, vy, !!p1, WEAPONS[w]); b.id = id; b.tx = x; b.ty = y; return b;
      });

      const oldC = new Map(arenaPickups.map(c => [c.key, c]));
      arenaPickups = s.c.map(([x, y, type]) => {
        const k = x + '_' + y + type;
        let c = oldC.get(k);
        if (!c) { c = new PickupCrate(x, y, type); c.key = k; }
        return c;
      });
    }

    // Guest: smooth motion between snapshots (no real physics)
    function guestStep(dt) {
      const k = 1 - Math.exp(-dt * 14); // how fast we blend toward the host's position
      [player1, player2, player3, player4].filter(Boolean).forEach(p => {
        if (!p.alive) return;
        p.x += p.vx * dt; p.y += p.vy * dt; p.angle += p.spinSpeed * dt;
        if (p.tx !== undefined) {
          p.tx += p.vx * dt; p.ty += p.vy * dt; p.tAng += p.spinSpeed * dt;
          p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k;
          let d = p.tAng - p.angle; d -= Math.PI * 2 * Math.round(d / (Math.PI * 2));
          p.angle += d * k;
        }
        const m = 22 * GUN_SCALE;
        p.x = Math.min(W - m, Math.max(m, p.x));
        p.y = Math.min(H - m - 10, Math.max(m, p.y));
        if (p.reloading) p.reloadTimer = Math.max(0, p.reloadTimer - dt);
      });
      bullets.forEach(b => {
        if (b.tx === undefined) return;
        b.tx += b.vx * dt; b.ty += b.vy * dt;
        b.x += (b.tx - b.x) * k; b.y += (b.ty - b.y) * k;
      });
    }

    // ---------- Crates (host / offline only) ----------
    setInterval(() => {
      if (isRunning && gameMode !== 'online-guest') {
        arenaPickups = arenaPickups.filter(c => c.active);
        if (arenaPickups.length < 2) {
          const type = Math.random() > 0.4 ? 'ammo' : 'health';
          arenaPickups.push(new PickupCrate(Math.random() * (W - 160) + 80, Math.random() * (H - 200) + 80, type));
        }
      }
    }, 7000);

    function dealDamage(target, owner, dmg, px, py, kx, ky, color) {
      const ffa = isFFA();
      target.hp -= dmg;
      AudioEngine.playHit();
      createSparks(px, py, color);
      target.vx += kx; target.vy += ky;
      target.spinSpeed += (Math.random() - 0.5) * 16;
      combatTexts.push(new FloatingText(target.x, target.y - 12, `-${dmg}`, '#ef4444'));
      updateHUD();
      if (target.hp > 0) return;
      target.alive = false;
      if (!ffa) { triggerVictory(owner === 0 ? 'Player 1' : (gameMode === 'ai' ? 'AI Bot' : 'Player 2'), target); return; }
      const left = [player1, player2, player3, player4].filter(p => p && p.alive).sort((a, c) => c.hp - a.hp);
      if (left.length <= 1 || (!player1.alive && soloFFA())) triggerVictory(nameOf(left.length ? left[0].index : owner), target);
      else { startKO(target.x, target.y); koActive = false; } // explosion + shake, no zoom
    }

    // ---------- Main loop ----------
    function gameLoop(timestamp) {
      if (!isRunning) return;

      let dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      if (dt > 0.05) dt = 0.05;
      dt *= timeScale;

      if (gameMode === 'online-guest') {
        guestStep(dt);
      } else {
        player1.update(dt);
        player2.update(dt);
        if (player3) player3.update(dt);
        if (player4) player4.update(dt);
        if (gameMode === 'ai') updateAI(dt);
        if (isFFA()) {
          const all4 = [player1, player2, player3, player4];
          [1, 2, 3].forEach(i => { const b = all4[i]; if (b && isBotSlot(i)) updateAI(dt, b, all4.filter(x => x !== b)); });
        }
      }

      bouncePads.forEach(pad => pad.update(dt));
      arenaPickups.forEach(crate => crate.update(dt));

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update(dt);
        if (!bullets[i].active) bullets.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      for (let i = combatTexts.length - 1; i >= 0; i--) {
        combatTexts[i].update(dt);
        if (combatTexts[i].life <= 0) combatTexts.splice(i, 1);
      }

      // Hit detection (host / offline only; guest just displays what host says)
      if (gameMode !== 'online-guest') {
        const all = isFFA() ? [player1, player2, player3, player4].filter(Boolean) : [player1, player2];
        bullets.forEach(b => {
          if (!b.active) return;
          const owner = b.owner !== undefined ? b.owner : (b.isPlayer1 ? 0 : 1);
          for (const target of all) {
            if (target.index === owner || !target.alive) continue;
            if (Math.hypot(b.x - target.x, b.y - target.y) < target.radius + b.radius) {
              b.active = false;
              dealDamage(target, owner, b.config.damage, b.x, b.y, b.vx * 0.2, b.vy * 0.2, b.config.color);
              break;
            }
          }
        });
        // Sword blades hurt whoever they touch (each target at most every 0.5s)
        all.forEach(a => {
          if (!a.alive || !a.config.melee) return;
          const L = (a.config.bladeLen + 8) * GUN_SCALE, vx = Math.cos(a.angle) * L, vy = Math.sin(a.angle) * L;
          all.forEach(t => {
            if (t === a || !t.alive || a.bladeCD[t.index] > 0) return;
            const u = Math.max(0, Math.min(1, ((t.x - a.x) * vx + (t.y - a.y) * vy) / (vx * vx + vy * vy)));
            const px = a.x + vx * u, py = a.y + vy * u;
            if (Math.hypot(t.x - px, t.y - py) < t.radius + (a.config.bladeWidth || 4)) {
              a.bladeCD[t.index] = 0.5;
              dealDamage(t, a.index, a.config.damage, px, py, Math.cos(a.angle) * 350, Math.sin(a.angle) * 350, '#e2e8f0');
            }
          });
        });
      }

      updateHUD();

      // Host streams state ~30x/sec
      if (gameMode === 'online-host' && timestamp - lastSend >= 32) {
        lastSend = timestamp;
        netSend(makeSnapshot());
      }

      // Render
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      if (screenShakeTime > 0) {
        screenShakeTime -= dt;
        ctx.translate((Math.random() - 0.5) * screenShakeForce * 8, (Math.random() - 0.5) * screenShakeForce * 8);
      }

      if (koActive) { // zoom in on the knocked-out gun
        const z = 1 + 0.6 * Math.min(1, (performance.now() - koStart) / 500);
        ctx.translate(koX, koY); ctx.scale(z, z); ctx.translate(-koX, -koY);
      }

      ctx.drawImage(gridCanvas, 0, 0);

      ctx.fillStyle = '#334155'; ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
      obstacles.forEach(o => { ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h); });

      bouncePads.forEach(p => p.draw());
      arenaPickups.forEach(c => c.draw());
      particles.forEach(p => p.draw());
      bullets.forEach(b => b.draw());
      player1.draw();
      player2.draw();
      if (player3) player3.draw();
      if (player4) player4.draw();
      combatTexts.forEach(t => t.draw());

      ctx.restore();

      if (koActive) { // white flash + K.O. text
        const t = (performance.now() - koStart) / 1000;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 0.5 - t * 1.5); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = Math.min(1, t * 4);
        ctx.font = '900 72px Orbitron'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 6; ctx.strokeStyle = '#020617'; ctx.strokeText('K.O.', W / 2, H / 2);
        ctx.fillStyle = '#ef4444'; ctx.fillText('K.O.', W / 2, H / 2);
        ctx.restore();
      }

      if (isRunning) requestAnimationFrame(gameLoop);
    }

    // Weapon buttons on the game-over screen
    (function () {
      const abbr = { revolver: 'REV', shotgun: 'SG', smg: 'SMG', sniper: 'SNP', plasma: 'PLS', sword: 'SWD', shield: 'SHD', rocket: 'RKT', burst: 'BRS', axe: 'AXE' };
      document.getElementById('go-weapons').innerHTML = Object.keys(WEAPONS).map(k =>
        `<button id="gbtn-${k}" onclick="selectWeapon('${k}')" class="go-wbtn py-2 border rounded-xl text-[10px] font-orbitron font-black active:scale-95 ${k === selectedWeaponType ? 'bg-amber-500/20 border-amber-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}">${abbr[k] || k.slice(0, 3).toUpperCase()}</button>`
      ).join('');
    })();

    // Invite link (?room=ABCD): open the online screen with the code filled in
    (function () {
      const r = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
      if (r.length === 4) {
        document.getElementById('join-code').value = r;
        showOnline(true);
        netStatus('Room ' + r + ' is ready. Tap JOIN.');
      }
    })();
  </script>
</body>
</html>
